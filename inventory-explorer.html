  item.Received  = fv('f-date');
  item.Threshold = isNaN(fn('f-threshold')) ? 1 : fn('f-threshold');
  persistItem(item);
  buildFilterOptions();
  applyFilters();
}

// Name is required. On blur, reject an empty value by reverting to the stored value.
// Otherwise behave like autoSaveField.
function autoSaveNameField() {
  if (editReadOnly) return;
  if (editIdx === null) return;
  const item = currentOwnItem(); if (!item) return;
  const v = fv('f-name');
  if (!v) {                                    // reject blank — revert
    $('f-name').value = item.Name || '';
    return;
  }
  item.Name = v;
  // Also flush the other Info fields (a single write persists the whole item).
  autoSaveField();
}

// Stock change has side-effects:
//   - Boxed items: reconcile Box2 tokens (preserve placed, drop/add unplaced).
//   - Auto-derive Status from new stock (unless locked into On Order / Arrived).
function autoSaveStockField() {
  if (editReadOnly) return;
  if (editIdx === null) return;
  const item = currentOwnItem(); if (!item) return;
  const newStock = isNaN(fn('f-stock')) ? 0 : fn('f-stock');
  applyStockChange(item, newStock);
  if (!LOCKED_ST.has((item.Status||'').toLowerCase())) {
    updateStatus(item, stockDerivedStatus(item));
  } else {
    persistItem(item);
  }
  configureActionForStatus(item, false);
  renderLocPanel(item);
  applyFilters();
}

// Toolbar/+ Add Item flow: [Create] button validates Name and creates the item.
// On success, modal flips to edit-mode of the new item (Create slot reverts to Order).
function createItem() {
  const name = fv('f-name');
  if (!name) { alert('Name is required.'); return; }
  const f = readForm();
  const stock = isNaN(fn('f-stock')) ? 1 : fn('f-stock');
  const newItem = makeNewItem(f, stock);
  items.push(newItem);
  persistItem(newItem);
  editIdx = newItem._id;
  modalMode = 'default';
  _hostBeforeNew = null;
  populateForm(newItem);
  configureActionForStatus(newItem, false);
  renderLocPanel(newItem);
  setLocFieldsDisabled(true);
  renderBottomBar();
  buildFilterOptions();
  applyFilters();
}

// ── Bottom-bar state machine ──────────────────────────────────────────
// renderBottomBar() owns ALL button visibility/labels. Every state change calls it.

// Enable/disable the location form fields (Location1, Location2, Box1, GridXY, Room, dims).
function setLocFieldsDisabled(disabled) {
  ['f-location-sel','f-location','f-subloc-sel','f-subloc',
   'f-box1-sel','f-box1','f-room-sel','f-room','dim-x','dim-y'].forEach(id => {
    const el = $(id); if (el) el.disabled = disabled;
  });
}

// Render the bottom-bar button row according to modalMode and the current item's status.
// Each button is shown or hidden via display style; labels and handlers reassigned in place.
function renderBottomBar() {
  const newBtn  = $('new-btn');
  const orderBtn= $('order-btn');
  const archBtn = $('archive-btn');
  const moveBtn = $('move-btn');
  const useBtn  = $('use-btn');
  if (!newBtn || !orderBtn || !archBtn || !moveBtn || !useBtn) return;
  // Hide everything; the active branch reveals what it needs.
  [newBtn, orderBtn, archBtn, moveBtn, useBtn].forEach(b => b.style.display = 'none');

  if (modalMode === 'new-from-toolbar' || modalMode === 'new-from-host') {
    // [Create] (in order-btn slot) and [Cancel] (in use-btn slot)
    orderBtn.style.display = '';
    orderBtn.textContent   = 'Create';
    orderBtn.className     = 'btn btn-primary btn-sm';
    orderBtn.onclick       = createItem;
    useBtn.style.display   = '';
    useBtn.textContent     = 'Cancel';
    useBtn.className       = 'btn btn-sm';
    useBtn.onclick         = newCancelClick;
    return;
  }

  if (modalMode === 'move') {
    archBtn.style.display = '';
    archBtn.textContent   = 'Archive';
    archBtn.className     = 'btn btn-danger btn-sm';
    archBtn.onclick       = archiveBtnClick;
    moveBtn.style.display = '';
    moveBtn.textContent   = 'Set';
    moveBtn.className     = 'btn btn-primary btn-sm';
    moveBtn.onclick       = moveBtnClick;             // re-armed (Set is a Move click in move-mode)
    useBtn.style.display  = '';
    useBtn.textContent    = 'Cancel';
    useBtn.className      = 'btn btn-sm';
    useBtn.onclick        = cancelMove;               // explicit so JS reassignment from new-mode is overridden
    return;
  }

  // 'default' — depends on whether the item is archived.
  const item = currentOwnItem();
  if (!item) return;
  const isArchived = getEffectiveStatus(item) === 'Archived';
  if (isArchived) {
    // [Delete] on left, [Restore] on right (Restore is the order-btn, configured by
    // configureActionForStatus when Status==='Archived').
    archBtn.style.display = '';
    archBtn.textContent   = 'Delete';
    archBtn.className     = 'btn btn-danger btn-sm';
    archBtn.onclick       = archiveBtnClick;
    orderBtn.style.display = '';     // [Restore], configured by configureActionForStatus
    return;
  }
  // Active item: [New]  [Order/Stock/Receive]  [Move]  [Use]
  newBtn.style.display   = '';
  newBtn.textContent     = 'New';
  newBtn.className       = 'btn btn-ok btn-sm';
  newBtn.onclick         = newBtnClick;
  orderBtn.style.display = '';     // [Order/Stock/Receive] configured by configureActionForStatus
  moveBtn.style.display  = '';
  moveBtn.textContent    = 'Move';
  moveBtn.className      = 'btn btn-primary btn-sm';
  moveBtn.onclick        = moveBtnClick;
  useBtn.style.display   = '';
  useBtn.textContent     = 'Use';
  useBtn.className       = 'btn btn-danger btn-sm';
  useBtn.onclick         = useBtnClick;
}

// Compatibility shim — old call sites call refreshMoveButtons; redirect to renderBottomBar.
function refreshMoveButtons() { renderBottomBar(); }

// [+ New] clicked from inside an existing-item modal: open new-mode and inherit Location
// from the host item; Information fields go blank. Cancel returns to the host.
function newBtnClick() {
  if (editIdx === null) return;       // would have been Create, not New
  const host = currentOwnItem();
  if (!host) return;
  _hostBeforeNew = host._id;
  // Snapshot Location values for inheritance.
  const inherited = {
    Location1: host.Location1 || '',
    Location2: host.Location2 || '',
    Box1:      host.Box1 || '',
    GridXY:    host.GridXY || '',
    Room:      host.Room || '',
  };
  editIdx = null;
  editLab = activeLab;                // the inherited-from-host new item belongs here
  modalMode = 'new-from-host';
  resetFormBlank();
  // Re-populate Location only.
  comboSet('f-location', inherited.Location1);
  comboSet('f-subloc',   inherited.Location2);
  comboSet('f-box1',     inherited.Box1);
  comboSet('f-room',     inherited.Room);
  $('f-gridxy').value = inherited.GridXY;
  const dims = parseGridXY(inherited.GridXY);
  $('dim-x').value = dims ? dims.cols : '';
  $('dim-y').value = dims ? dims.rows : '';
  $('f-stock').value     = 1;
  $('f-threshold').value = 1;
  // Sharing card shows the new-item policy editor.
  renderSharingPanel({ Policy:'No', Sharing:'', Borrower:'', Borrowed:'' });
  // Clear the location-panel preview area.
  $('loc-panel-wrap').innerHTML = '';
  setLocFieldsDisabled(false);        // new-mode allows the user to edit location
  renderBottomBar();
  setTimeout(() => $('f-name').focus(), 0);
}

// [Cancel] clicked in new-mode (this is the use-btn slot relabeled).
// - From toolbar:  close the modal entirely.
// - From host:     return to the host item in default state.
function newCancelClick() {
  if (modalMode === 'new-from-toolbar') {
    closeEditModal(true);
    return;
  }
  if (modalMode === 'new-from-host') {
    const hostId = _hostBeforeNew;
    _hostBeforeNew = null;
    modalMode = 'default';
    if (hostId !== null) {
      const host = items.find(i => i._id === hostId);
      if (host) {
        editIdx = hostId;
        populateForm(host);
        configureActionForStatus(host, false);
        renderLocPanel(host);
        setLocFieldsDisabled(true);
        renderBottomBar();
        return;
      }
    }
    closeEditModal(true);
  }
}

// [Move] click: enter move-mode (snapshot location, enable fields, redraw bar).
// [Set] click (move-mode): commit the location change.
function moveBtnClick() {
  if (editReadOnly) return;
  if (editIdx === null) return;
  if (modalMode !== 'move') {
    _moveSnapshot = {
      Location1: fv('f-location'),
      Location2: fv('f-subloc'),
      Box1:      fv('f-box1'),
      GridXY:    fv('f-gridxy'),
      Room:      fv('f-room'),
      dimX:      $('dim-x').value,
      dimY:      $('dim-y').value,
    };
    modalMode = 'move';
    setLocFieldsDisabled(false);
    renderBottomBar();
    return;
  }
  // [Set] click — commit.
  commitMove();
}

// Commit pending move: write location fields, propagate side-effects, exit move-mode.
function commitMove() {
  const item = currentOwnItem(); if (!item) return;
  const newBox1   = fv('f-box1');
  const newGridXY = fv('f-gridxy');
  const oldKey    = { Location1: item.Location1, Location2: item.Location2, Box1: item.Box1 };
  const oldRoom   = item.Room || '';
  const wasBoxed  = !!item.Box1;
  const nowBoxed  = !!newBox1;

  item.Location1 = fv('f-location');
  item.Location2 = fv('f-subloc');
  item.Box1      = newBox1;
  item.GridXY    = newGridXY;
  item.Room      = fv('f-room');

  if (nowBoxed && (oldKey.Box1 !== newBox1 || oldKey.Location1 !== item.Location1 || oldKey.Location2 !== item.Location2)) {
    const count = Math.max(1, getStock(item));
    item.Box2 = encodeBox2(new Array(count).fill('0'));
  }
  if (wasBoxed && !nowBoxed) item.Box2 = '';
  if (oldKey.Box1 && oldKey.Box1 !== newBox1) propagateBox1Rename(oldKey, newBox1, item._id);
  if (newGridXY) propagateGridXY(item);
  const pathUnchanged = oldKey.Box1 === item.Box1
    && oldKey.Location1 === item.Location1
    && oldKey.Location2 === item.Location2;
  if (pathUnchanged && (item.Room || '') !== oldRoom) propagateRoom(item, oldRoom);
  if (item.Box1) item.Stock = parseBox2(item.Box2 || '').length || getStock(item);

  persistItem(item);
  buildFilterOptions();
  applyFilters();
  renderLocPanel(item);

  modalMode = 'default';
  _moveSnapshot = null;
  setLocFieldsDisabled(true);
  renderBottomBar();
}

// [Cancel] click during move-mode: revert location fields to snapshot, exit move-mode.
function cancelMove() {
  if (modalMode !== 'move' || !_moveSnapshot) return;
  comboSet('f-location', _moveSnapshot.Location1);
  comboSet('f-subloc',   _moveSnapshot.Location2);
  comboSet('f-box1',     _moveSnapshot.Box1);
  comboSet('f-room',     _moveSnapshot.Room);
  $('f-gridxy').value = _moveSnapshot.GridXY;
  $('dim-x').value    = _moveSnapshot.dimX;
  $('dim-y').value    = _moveSnapshot.dimY;
  modalMode = 'default';
  _moveSnapshot = null;
  setLocFieldsDisabled(true);
  renderBottomBar();
}

// [Archive] / [Delete]: delegate to deleteCurrentItem (existing archive/delete UX).
// In Move mode, Archive still works — the move snapshot is discarded.
// After archive, the modal STAYS OPEN on the now-archived item; the bar redraws to
// the archived state ([Delete] [Restore]) so the user can act further or click outside.
function archiveBtnClick() {
  if (modalMode === 'move') { modalMode = 'default'; _moveSnapshot = null; setLocFieldsDisabled(true); }
  // Capture id BEFORE deleteCurrentItem runs (it closes the modal which resets editIdx).
  const targetId = editIdx;
  const wasReadOnly = editReadOnly;
  deleteCurrentItem();
  // If the item still exists in the items list and just transitioned to Archived (not Deleted),
  // re-open the modal on it so [Delete] / [Restore] are available without a list round-trip.
  const it = items.find(i => i._id === targetId && !i._deleted && getEffectiveStatus(i) === 'Archived');
  if (it) {
    editIdx = targetId;
    editReadOnly = wasReadOnly;
    populateForm(it);
    configureActionForStatus(it, false);
    renderLocPanel(it);
    setLocFieldsDisabled(true);
    renderBottomBar();
    $('edit-modal-overlay').classList.add('open');
  }
}

// [Use] click: decrement stock by 1.
// In move-mode this same button is morphed to [Cancel] and routes there instead.
function useBtnClick() {
  if (modalMode === 'move') { cancelMove(); return; }
  if (editReadOnly) return;
  if (editIdx === null) return;
  const item = currentOwnItem(); if (!item) return;

  // Unboxed items (no Box1): just decrement the numeric Stock.
  if (!item.Box1) {
    const newStock = Math.max(0, getStock(item) - 1);
    item.Stock = newStock;
    if (!LOCKED_ST.has((item.Status||'').toLowerCase())) {
      updateStatus(item, stockDerivedStatus(item));
    } else {
      persistItem(item);
    }
    const stockEl = $('f-stock');
    if (stockEl) stockEl.value = newStock;
    configureActionForStatus(item, false);
    applyFilters();
    return;
  }

  // Boxed items: consume one token. Prefer a selected coord; otherwise an unplaced token;
  // otherwise the first placed coord.
  let coord = null;
  if (locSelected && locSelected.coord) coord = locSelected.coord;
  else {
    const toks = parseBox2(item.Box2 || '');
    if (toks.length === 0) return;
    coord = toks.includes('0') ? '0' : toks[0];
  }
  consumeOneToken(item, coord);
  resetLocState();
  redrawLoc();
}

// (applyStockChange defined earlier — see line ~870 for the canonical implementation.)

// Close the edit modal and reset all modal-related state.
function closeEditModal(force) {
  if (!force) {
    // No dirty check (auto-save means there's nothing pending), but allow callers a hook.
  }
  $('edit-modal-overlay').classList.remove('open');
  editIdx = null;
  editLab = '';
  editReadOnly = false;
  resetLocState(); locView = null;
  modalMode = 'default';
  _moveSnapshot = null;
  _hostBeforeNew = null;
  const box = document.querySelector('.modal-box');
  if (box) box.classList.remove('read-only');
}

// Live preview when stock or box fields change (for the location panel)
function onBoxFieldChange() {
  if (editIdx === null) return;
  const item = items.find(i => i._id === editIdx);
  if (!item) return;
  const preview = Object.assign({}, item, {
    Box1: fv('f-box1'),
    GridXY: fv('f-gridxy'),
  });
  renderLocPanel(preview);
}

function applyDimensionsFromForm() {
  const x = parseInt($('dim-x').value, 10);
  const y = parseInt($('dim-y').value, 10);
  const valid = x >= 1 && y >= 1;
  const val = valid ? `X${Math.min(x,26)} Y${Math.min(y,26)}` : '';
  $('f-gridxy').value = val;

  if (editIdx === null) return;
  const item = items.find(i => i._id === editIdx);
  if (!item || !item.Box1) return;
  const preview = Object.assign({}, item, { GridXY: val, Box1: fv('f-box1') });
  renderLocPanel(preview);
}

// ── Location panel ─────────────────────────────────────────────────────
// View/Return toggle for the View buttons next to Location 1 and Location 2.
// Clicking View on a level scopes the panel to that level (drill up). Clicking Return on
// the active level brings the panel back to the current box. Clicking View on a different
// level than the currently-active drill switches scope.
function toggleViewLevel(level) {
  const item = modalFind(editIdx);
  if (!item) return;

  const activeLevel = locView && (locView.loc2 ? 2 : 1);
  if (activeLevel === level) {
    locView = null;            // Return — back to current box
  } else if (level === 1) {
    if (!item.Location1) return;
    locView = { loc1: item.Location1 };
  } else {
    if (!item.Location1 || !item.Location2) return;
    locView = { loc1: item.Location1, loc2: item.Location2 };
  }
  locSelected = null;
  renderLocPanel(item);
  updateViewBtns(item);
}

// Reflect the current View state on the buttons (label + active styling, disabled when the
// corresponding location field is empty).
function updateViewBtns(item) {
  const btn1 = $('view-loc1');
  const btn2 = $('view-loc2');
  if (!btn1 || !btn2) return;
  const activeLevel = locView && (locView.loc2 ? 2 : 1);
  const has1 = !!(item && item.Location1);
  const has2 = !!(item && item.Location1 && item.Location2);

  // Eye = "view this location's contents". Back-arrow = "return to the item" (active state).
  // Inline SVG keeps the icon under our control and avoids loading an icon font.
  const EYE_SVG  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  const BACK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>';

  btn1.innerHTML = activeLevel === 1 ? BACK_SVG : EYE_SVG;
  btn1.title     = activeLevel === 1 ? 'Return to item' : 'View Location 1 contents';
  btn1.classList.toggle('is-active', activeLevel === 1);
  btn1.disabled  = !has1;

  btn2.innerHTML = activeLevel === 2 ? BACK_SVG : EYE_SVG;
  btn2.title     = activeLevel === 2 ? 'Return to item' : 'View Location 2 contents';
  btn2.classList.toggle('is-active', activeLevel === 2);
  btn2.disabled  = !has2;
}

// Group items by Name+Vendor+Catalog and accumulate a numeric field.
// `getValue` returns the per-item contribution; `extra` lets callers track flags.
function groupByIdentity(arr, getValue, extra) {
  const seen = {}, out = [];
  arr.forEach(it => {
    const key = (it.Name||'').trim() + '|' + (it.Vendor||'').trim() + '|' + (it.Catalog||'').trim();
    if (seen[key] !== undefined) {
      out[seen[key]].total += getValue(it);
      if (extra) extra(out[seen[key]], it);
    } else {
      seen[key] = out.length;
      const entry = { rep: it, total: getValue(it) };
      if (extra) extra(entry, it);
      out.push(entry);
    }
  });
  return out;
}

function renderScopedList(item, wrap) {
  const loc1 = locView && locView.loc1;
  const loc2 = locView && locView.loc2;
  const scoped = modalItems().filter(i => !i._deleted
    && (!loc1 || i.Location1 === loc1)
    && (!loc2 || i.Location2 === loc2));

  // Group by Box1 first
  const byBox = {};
  scoped.forEach(i => { const k = i.Box1 || '(no box)'; (byBox[k] = byBox[k] || []).push(i); });

  let html = '';
  Object.keys(byBox).sort().forEach(box => {
    html += `<div class="box-list-hdr">${esc(box)}</div>`;
    const groups = groupByIdentity(byBox[box], getStock).sort((a,b) => a.rep.Name.localeCompare(b.rep.Name));
    groups.forEach(({rep, total}) => {
      const short = rep.Name.length > 26 ? rep.Name.slice(0,25)+'…' : rep.Name;
      html += `<div class="bli" onclick="locScopeSelect(${rep._id})">
        <div class="bli-name" title="${esc(rep.Name)}">${esc(short)}</div>
        <div class="bli-status">${getEffectiveStatus(rep)} · ${total}</div>
      </div>`;
    });
  });

  const title = loc2
    ? `${esc(loc1)} \u203a <strong>${esc(loc2)}</strong>`
    : `<strong>${esc(loc1)}</strong>`;

  wrap.innerHTML = `<div style="font-size:13px;margin-bottom:6px;color:var(--mut);">Viewing ${title}</div>
    <div class="box-list">${html || '<div class="muted-italic">No items.</div>'}</div>`;
}

function locScopeSelect(itemId) {
  const sib = modalFind(itemId);
  if (!sib) return;
  editIdx = itemId;
  populateForm(sib);
  configureActionForStatus(sib, false);   // refresh sharing panel and action button
  locView = null;
  locSelected = null;
  renderLocPanel(sib);
}

// Reset placement state: deselect any selected cell.
function resetLocState() { locSelected = null; }

// Re-render the loc panel for the currently-edited item plus refresh the main list.
// Most placement actions end with these two calls, so consolidate.
function redrawLoc() {
  renderLocPanel(items.find(i => i._id === editIdx));
  applyFilters();
}

function renderLocPanel(item) {
  const wrap = $('loc-panel-wrap');
  // Respect the user's View selection FIRST. The View buttons operate on Location1 /
  // Location2 scope, which is meaningful even for items without a Box1 of their own.
  if (locView) { renderScopedList(item, wrap); updateViewBtns(item); refreshLocActionRow(); return; }
  if (!item || !item.Box1) {
    wrap.innerHTML = `<div class="muted-italic" style="padding:8px 2px;">Assign Box 1 to enable location tracking.</div>`;
    updateViewBtns(item);
    refreshLocActionRow();
    return;
  }
  const dims = parseGridXY(item.GridXY || '');
  const useGrid = dims && !(dims.cols === 1 && dims.rows === 1);
  if (useGrid) renderLocGrid(item, wrap, dims, item);
  else         renderLocList(item, wrap, false, item);
  updateViewBtns(item);
  refreshLocActionRow();
}

function renderUnplacedRows(sibs) {
  // Group unplaced ('0') tokens by identity, render one row per token
  const groups = groupByIdentity(sibs, () => 0, (entry, it) => {
    entry.surplus = (entry.surplus || 0) + box2ListCount(it.Box2);
  });
  let html = '';
  groups.forEach(({rep, surplus}) => {
    if (!surplus) return;
    // An unplaced token is "selected" when locSelected is the '0' sentinel.
    const isSel = !!(locSelected && locSelected.coord === '0');
    const short = rep.Name.length > 20 ? rep.Name.slice(0,19)+'…' : rep.Name;
    for (let k = 0; k < surplus; k++) {
      html += `<div class="bli bli-unplaced${isSel?' bli-active':''}" onclick="locSelectUnplaced()">
        <div class="bli-name" title="Click to place in a grid cell">□ ${esc(short)}</div>
        <div class="bli-status">unplaced</div>
      </div>`;
    }
  });
  return html;
}

// Wrap the inner panel content with the standard chrome (header breadcrumb is rendered
// by the caller; this just provides the consistent inner container).
function locPanelHTML(item, body) {
  return `<div class="loc-inner">
    ${body}
  </div>`;
}

function renderLocList(item, wrap, hasGrid, preview) {
  const sibs = boxSiblingsWithPreview(item, preview);
  const groups = groupByIdentity(sibs, getStock, (entry, it) => {
    entry.hasPlaced = entry.hasPlaced || box2Coords(it.Box2).length > 0;
  });
  const visible = groups
    .filter(g => !hasGrid || g.hasPlaced)
    .sort((a,b) => a.rep.Name.localeCompare(b.rep.Name));

  const rows = visible.map(({rep, total}) => {
    const isCur = rep._id === editIdx;
    const short = rep.Name.length > 24 ? rep.Name.slice(0,23)+'\u2026' : rep.Name;
    // Clicking another item navigates the modal to it; clicking the current item is a no-op.
    const handler = isCur ? '' : `onclick="locNavigateTo(${rep._id})"`;
    return `<div class="bli${isCur?' bli-active':''}" ${handler}>
      <div class="bli-name" title="${esc(rep.Name)}">${esc(short)}</div>
      <div class="bli-status">${total} in stock</div>
    </div>`;
  }).join('');

  const unplacedHtml = hasGrid ? renderUnplacedRows(sibs) : '';
  const inner = (rows + unplacedHtml) || '<div class="muted-italic">No items.</div>';

  wrap.innerHTML = locPanelHTML(item, `<div class="box-list">${inner}</div>`);
}

function renderLocGrid(item, wrap, dims, preview) {
  const {cols, rows} = dims;
  const sibs = boxSiblingsWithPreview(item, preview);
  const occ = {};
  sibs.forEach(sib => box2Coords(sib.Box2).forEach(c => { occ[c] = sib; }));

  let colLbls = '<div class="grid-col-labels">';
  for (let c=1; c<=cols; c++) colLbls += `<div class="grid-col-lbl">${c}</div>`;
  colLbls += '</div>';

  // When any token is selected (a placed coord or the '0' unplaced sentinel), empty cells
  // become click-targets to move/place that token, so show the placing cursor on them.
  const willPlace = !!(locSelected && locSelected.coord);

  let gridRows = '';
  for (let r=0; r<rows; r++) {
    const rowLetter = String.fromCharCode(65+r);
    let cells = '';
    for (let c=1; c<=cols; c++) {
      const coord    = `${rowLetter}${c}`;
      const occupant = occ[coord];
      const isSel    = locSelected && locSelected.coord === coord;
      const isOwn    = occupant && occupant._id === editIdx;
      let cellCls = 'grid-cell';
      let inner = '', handler = '';
      if (occupant) {
        // mk-active (strong) > mk-owned (soft) — both can hint the cell, but the cell
        // selected by click gets the full color regardless of ownership.
        const mCls = isSel ? 'mk-active' : (isOwn ? 'mk-owned' : '');
        cellCls += ` c-occupied${isSel?' c-staged':''}`;
        inner   = `<div class="grid-marker ${mCls}">${esc(occupant.Name.slice(0,3))}</div>`;
        handler = `onclick="locSelectOccupied('${coord}',${occupant._id})" data-tip="${esc(occupant.Name)} \u00b7 ${getEffectiveStatus(occupant)}"`;
      } else {
        cellCls += willPlace ? ' c-placing' : '';
        handler = `onclick="locSelectEmpty('${coord}')" data-tip="${coord}"`;
      }
      cells += `<div class="${cellCls}" ${handler}>${inner}</div>`;
    }
    gridRows += `<div class="grid-row"><div class="grid-row-lbl">${rowLetter}</div>${cells}</div>`;
  }

  const unplaced = renderUnplacedRows(sibs);
  const body = `<div class="grid-outer">${colLbls}${gridRows}</div>` +
               (unplaced ? `<div class="box-list" style="margin-top:6px;">${unplaced}</div>` : '');

  wrap.innerHTML = locPanelHTML(item, body);
}

// ── Location placement: current-item-only ──────────────────────────────
// The modal operates on a single item identity. Box placement and removal apply only to
// the item currently being edited. Clicking another item's cell in the grid switches
// the modal to that item (navigation) — clean read-side affordance, no cross-item edits.
//
// locSelected: { coord } | null — the current item's selected box cell ('0' = unplaced).

// The bottom-bar [Use] button replaced the old Location-section Remove button, and the
// old add/remove "modes" are gone (adding is toolbar-only, removing is the Use button).
// This helper is retained as a no-op for the call sites that still invoke it.
function refreshLocActionRow() {}

function locCancelSelect() {
  resetLocState();
  const cur = items.find(i => i._id === editIdx);
  if (cur) renderLocPanel(cur);
}

// Click an empty cell on the current item's grid.
//   - If a coord on the current item is selected → MOVE that token here (the within-box-
//     move feature). This is the bug-fix case: previously only unplaced-token placement
//     was supported, not placed-to-placed move.
//   - If '0' (unplaced) is selected → place one unplaced token here.
//   - Otherwise: pick an unplaced token (if any) and place it.
function locSelectEmpty(coord) {
  if (editReadOnly) return;
  const cur = items.find(i => i._id === editIdx);
  if (!cur || !coord) return;
  const tokens = parseBox2(cur.Box2 || '');

  // (1) If a placed coord on this item is selected, move it here.
  if (locSelected && locSelected.coord && locSelected.coord !== '0') {
    const idx = tokens.indexOf(locSelected.coord);
    if (idx !== -1) {
      tokens[idx] = coord;
      cur.Box2 = encodeBox2(tokens);
      persistItem(cur);
      resetLocState();
      redrawLoc();
      return;
    }
  }
  // (2) If an unplaced token is selected, place it here.
  if (locSelected && locSelected.coord === '0') {
    const idx = tokens.indexOf('0');
    if (idx === -1) { resetLocState(); redrawLoc(); return; }
    tokens[idx] = coord;
    cur.Box2 = encodeBox2(tokens);
    persistItem(cur);
    resetLocState();
    redrawLoc();
    return;
  }
  // (3) Nothing selected: if there's an unplaced token, place it here (convenience).
  const idx = tokens.indexOf('0');
  if (idx === -1) return;
  tokens[idx] = coord;
  cur.Box2 = encodeBox2(tokens);
  persistItem(cur);
  resetLocState();
  redrawLoc();
}

// Click an occupied cell.
//   - Belongs to the CURRENT item: select that coord (so Use or a click on an empty cell
//     can act on it). Clicking the same coord again deselects.
//   - Belongs to ANOTHER item: navigate the modal to that item and select the clicked
//     coord in one action.
function locSelectOccupied(coord, itemId) {
  const clicked = modalFind(itemId);
  if (!clicked) return;

  // Cell belongs to a DIFFERENT item → switch the modal to that item AND select the
  // clicked coord. One click does both: the modal updates to show that item, and the
  // coord is now selected so Use / Move-to-empty-cell can act on it immediately.
  if (itemId !== editIdx) {
    editIdx = itemId;
    populateForm(clicked);
    configureActionForStatus(clicked, false);
    locSelected = { coord };
    renderLocPanel(clicked);
    return;
  }

  // Cell belongs to the CURRENT item.
  // Same coord clicked again → deselect.
  if (locSelected && locSelected.coord === coord) {
    locCancelSelect();
    return;
  }
  // Otherwise select this coord.
  locSelected = { coord };
  renderLocPanel(clicked);
}

// Click an unplaced row (this item's own unplaced units).
//   - Select it (sentinel coord '0') so a click on an empty cell will place it there.
//   - Clicking again deselects.
function locSelectUnplaced() {
  if (editReadOnly) return;
  const cur = items.find(i => i._id === editIdx);
  if (!cur) return;
  if (locSelected && locSelected.coord === '0') {
    locCancelSelect();
    return;
  }
  locSelected = { coord: '0' };
  renderLocPanel(cur);
}

// Build a brand-new item record from form data. Called by createItem (toolbar Add flow).
function makeNewItem(f, stock) {
  const item = {
    _id: nextId++, _row: null, _deleted: false,
    Name: f.Name, Vendor: f.Vendor, Catalog: f.Catalog, Price: f.Price,
    Type: f.Type, Size: f.Size, Received: f.Received,
    Threshold: f.Threshold,
    Location1: f.Location1, Location2: f.Location2,
    Box1: f.Box1, Room: f.Room, GridXY: f.GridXY,
    CAS: f.CAS, Container: f.Container, Safety: f.Safety, SDS: f.SDS, URL: f.URL, Notes: f.Notes,
    Policy: '',
    Sharing: '', Borrower: '', Borrowed: '',
    Stock: 0, Box2: '',
    Status: '',
  };
  const policySel = $('sp-policy');
  if (policySel && ['No','Ask','Yes'].includes(policySel.value)) item.Policy = policySel.value;
  if (item.Box1) {
    item.Box2 = encodeBox2(new Array(Math.max(1, stock|0)).fill('0'));
    item.Stock = parseBox2(item.Box2).length;
  } else {
    item.Stock = Math.max(0, stock|0);
  }
  item.Status = stockDerivedStatus(item);
  return item;
}

// Navigate the modal to another item in the same box.
function locNavigateTo(itemId) {
  const target = items.find(i => i._id === itemId);
  if (!target) return;
  editIdx = itemId;
  resetLocState();
  populateForm(target);
  configureActionForStatus(target, false);
  renderLocPanel(target);
}

// Remove one token (placed coord or '0') from item.Box2 and update derived stock + status.
function consumeOneToken(item, token) {
  const tokens = parseBox2(item.Box2);
  const idx = tokens.indexOf(token);
  if (idx !== -1) tokens.splice(idx, 1);
  item.Box2  = encodeBox2(tokens);
  item.Stock = parseBox2(item.Box2).length;
  if (!LOCKED_ST.has((item.Status||'').toLowerCase())) {
    updateStatus(item, stockDerivedStatus(item));
  } else {
    persistItem(item);
  }
  // If the consumed item is the one currently displayed in the modal form, mirror the
  // stock change into the Stock input so it's visible without re-clicking another item.
  if (item._id === editIdx) {
    const stockEl = $('f-stock');
    if (stockEl) stockEl.value = getStock(item);
  }
}

// ── Order state machine ────────────────────────────────────────────────
// Apply a mutation to the current item and stay in the modal. Used by every status-section
// transition button (Order / Add Stock / Receive / Restore). After mutation, re-populate
// the form, reconfigure the status button for the new state, and refresh the location panel.
function commitAndStayOpen(mutator) {
  const item = items.find(i => i._id === editIdx);
  if (!item) return;
  mutator(item);
  populateForm(item);                       // refresh the form from the item
  configureActionForStatus(item, false);    // pick the next button label for the new status
  renderLocPanel(item);
  applyFilters();
}

// With on-blur auto-save, the form's field values are already committed to the item.
// These workflow handlers only need to update the lifecycle Status.
function orderItem()      { commitAndStayOpen(item => updateStatus(item, 'On Order')); }
function confirmArrived() { commitAndStayOpen(item => updateStatus(item, 'Arrived')); }
function receiveItem()    { commitAndStayOpen(item => updateStatus(item, stockDerivedStatus(item))); }
function restoreItem()    { commitAndStayOpen(item => updateStatus(item, stockDerivedStatus(item))); }

// Variant that closes the modal after mutation — for transactional sharing actions
// (Borrow, Request, Accept, Deny, Return), which are complete user gestures.
function commitAndClose(mutator) {
  const item = modalFind(editIdx);
  if (!item) return;
  mutator(item);
  applyFilters();
  closeEditModal(true);   // force-close — we handled the save
}

// ── Archive / Delete ───────────────────────────────────────────────────
// Clear all placement coords on an item, leaving stock count intact as unplaced tokens.
// Used on archive: on restore, the user re-places each unit manually.
function clearPlacements(item) {
  if (!item.Box1 || !item.Box2) return;
  const count = parseBox2(item.Box2).length;
  item.Box2 = encodeBox2(new Array(count).fill('0'));
}

function deleteCurrentItem() {
  if (editReadOnly) return;
  const item = currentOwnItem(); if (!item) return;
  const isArchived = getEffectiveStatus(item) === 'Archived';
  const stock = getStock(item);

  // Archive/Delete is always a row-level operation. When a boxed row represents multiple
  // physical units (Stock > 1), archiving means archiving ALL of them at once — there's no
  // per-unit archive state on a single row. Confirm the count so it isn't accidental.
  if (item.Box1 && stock > 1 && !isArchived) {
    if (!confirm(`Archive all ${stock} items?`)) return;
  }

  if (isArchived) {
    // Soft delete — mark the row as Deleted in the sheet, hide it from the UI,
    // but never remove the underlying row.
    if (!confirm('Mark this archived item as Deleted? It will be hidden from the inventory but kept in the sheet.')) return;
    updateStatus(item, 'Deleted');
  } else {
    // Archive: clear placements (stock count preserved as unplaced tokens), mark archived.
    // On Restore the user re-places each unit manually.
    clearPlacements(item);
    updateStatus(item, 'Archived');
  }

  closeEditModal(true); buildFilterOptions(); applyFilters();
}

// ── Sharing panel ──────────────────────────────────────────────────────
function setSharingTitle(label) {
  const el = $('sharing-title-suffix');
  if (el) el.textContent = label ? ` \u2014 ${label}` : '';
}

function renderSharingPanel(item, overridePolicy) {
  const card    = $('sec-sharing');
  const wrap    = $('sharing-panel-wrap');
  if (!card || !wrap) return;
  const isCopy   = isBorrowedCopy(item);
  // Loan state lives in the Sharing column for BOTH host rows and borrowed copies (the
  // copy uses 'Borrowed' where the host shows 'Shared'). Map Borrowed→Shared so the
  // shared panel branches are reused; the borrower-vs-host control split is via `own`.
  const sharing  = (s => s === 'Borrowed' ? 'Shared' : s)(getSharingState(item));
  // `policy` is the EFFECTIVE policy used for the card accent + title (may be bumped down
  // from Yes→Ask for Low Stock items as a safety cue). `storedPolicy` is the item's TRUE
  // saved policy, used for the editable dropdown so the user always sees/sets the real
  // value — otherwise setting Yes on a low-stock item would silently snap back to Ask.
  const policy       = overridePolicy || getSharingPolicy(item);
  const storedPolicy = getSharingPolicy(item);
  const borrower = item.Borrower || '';
  const borrowed = (item.Borrowed || '').slice(0, 10);
  // "own" = the host (owning-lab) view, which gets host controls (Bring Back / Resolved /
  // policy editor). A borrowed COPY lives in the viewer's own tab but they are the
  // BORROWER, not the host — so it must use the borrower controls regardless of isOwnLab().
  const own      = isOwnLab() && !isCopy;

  // Card accent colour. IOU and Bring Back are danger states regardless of source policy.
  card.classList.remove('policy-yes', 'policy-ask', 'policy-no', 'policy-iou');
  if (sharing === 'IOU' || sharing === 'Bring Back' || sharing === 'Denied') card.classList.add('policy-iou');
  else if (policy === 'Yes')   card.classList.add('policy-yes');
  else if (policy === 'Ask')   card.classList.add('policy-ask');
  else                         card.classList.add('policy-no');

  // Title carries the sharing STATE (plus borrower · date for active transactions);
  // idle items show the policy word.
  const nd = borrower ? `${borrower}${borrowed ? ' \u00b7 ' + borrowed : ''}` : '';
  let titleLabel;
  if (sharing === 'IOU' && borrower)             titleLabel = `IOU \u00b7 ${nd}`;
  else if (sharing === 'Denied' && borrower)     titleLabel = `Denied \u00b7 ${nd}`;
  else if (sharing === 'Bring Back' && borrower) titleLabel = `Bring Back \u00b7 ${nd}`;
  else if (sharing === 'Requested' && borrower)  titleLabel = `Requested \u00b7 ${nd}`;
  else if (sharing === 'Shared' && borrower)     titleLabel = `Shared \u00b7 ${nd}`;
  else                                           titleLabel = policy; // Yes / Ask / No
  setSharingTitle(titleLabel);

  // Body — a single horizontal row. Active transactions show their action buttons only
  // (name/date now live in the title). Idle items: policy editor in your own lab, or the
  // borrow/request control when viewing another lab's item.
  let body;
  if (sharing === 'Denied' && borrower) {
    // Borrower's copy after the host denied the request. Acknowledge soft-deletes it.
    body = `<div class="sharing-row">
        <span class="muted-italic" style="flex:1;">Request was denied.</span>
        <button class="btn btn-ok btn-sm" onclick="acknowledgeDenied()">OK</button>
      </div>`;
  } else if (sharing === 'IOU' && borrower) {
    // IOU: the borrower consumed the unit. Only the host resolves it (single click,
    // no PI gate). The borrower has nothing left to do — show state via the title only.
    body = own
      ? `<div class="sharing-row">
          <button class="btn btn-ok btn-sm" onclick="resolveSharing()">Resolved</button>
        </div>`
      : `<div class="sharing-row muted-italic">Item owed back to the owning lab.</div>`;
  } else if (sharing === 'Bring Back' && borrower) {
    // Host recalled the item. Host can force-resolve back to In Stock; the borrower
    // still has Return / IOU (the normal ways the loan ends).
    body = own
      ? `<div class="sharing-row">
          <button class="btn btn-ok btn-sm" onclick="resolveSharing()">Resolved</button>
        </div>`
      : `<div class="sharing-row">
          <button class="btn btn-ok btn-sm" onclick="returnItem()">Return</button>
          <button class="btn btn-danger btn-sm" onclick="iouItem()">IOU</button>
        </div>`;
  } else if (sharing === 'Requested' && borrower && isCopy) {
    // Borrower's own copy of a still-pending request — passive, waiting on the host.
    body = `<div class="sharing-row muted-italic">Request pending host approval.</div>`;
  } else if (sharing === 'Requested' && borrower) {
    body = `<div class="sharing-row">
        <button class="btn btn-borrow btn-sm" onclick="acceptRequest()">Accept</button>
        <button class="btn btn-danger btn-sm" onclick="denyRequest()">Deny</button>
      </div>`;
  } else if (sharing === 'Shared' && borrower) {
    // Host can recall (Bring Back). Borrower can Return or flag IOU.
    body = own
      ? `<div class="sharing-row">
          <button class="btn btn-danger btn-sm" onclick="bringBackItem()">Bring Back</button>
        </div>`
      : `<div class="sharing-row">
          <button class="btn btn-ok btn-sm" onclick="returnItem()">Return</button>
          <button class="btn btn-danger btn-sm" onclick="iouItem()">IOU</button>
        </div>`;
  } else if (own) {
    // Idle, your own lab: set the sharing policy. Set commits immediately, modal stays open.
    const opt = p => `<option value="${p}"${storedPolicy===p?' selected':''}>${p}</option>`;
    body = `<div class="sharing-row">
        <select id="sp-policy" class="sp-inp sp-inp-name">${opt('No')}${opt('Ask')}${opt('Yes')}</select>
        <button class="btn btn-borrow btn-sm" onclick="setPolicy()">Set</button>
      </div>`;
  } else if (policy === 'No') {
    body = `<div class="sharing-row muted-italic">Item is not shared.</div>`;
  } else {
    // Idle, foreign lab: borrow or request the item.
    const actionBtn = policy === 'Yes'
      ? `<button class="btn btn-borrow btn-sm" onclick="borrowItem()">Borrow</button>`
      : `<button class="btn btn-ask btn-sm"    onclick="requestItem()">Request</button>`;
    body = `<div class="sharing-row">
        <input id="sp-borrower" class="sp-inp sp-inp-name" type="text" placeholder="Name">
        <input id="sp-date"     class="sp-inp sp-inp-date" type="date" value="${todayLocal()}">
        ${actionBtn}
      </div>`;
  }

  wrap.innerHTML = body;
  card.style.display = '';
}

// Apply the chosen policy. Persists, keeps the modal open, re-renders the panel so the
// new accent/title show immediately. No code-check — the user is in their own lab.
function setPolicy() {
  const item = modalFind(editIdx);
  if (!item) return;
  const newPolicy = $('sp-policy').value;
  if (newPolicy !== getSharingPolicy(item)) {
    item.Policy = newPolicy;             // policy lives in its own column, never Sharing
    persistItem(item);
    applyFilters();
  }
  configureActionForStatus(item, false); // re-render panel (title + accent + body)
}

// Render a single status-message notice into the right-column status messages area.
function setStatusTitle(label) {
  const el = $('status-title-suffix');
  if (!el) return;
  el.textContent = label ? ` \u2014 ${label}` : '';
}

// Common starter for borrow/request: validate name, capture borrower + date, persist
// the host row to the loan state, and write the borrowed copy to the borrowing lab.
// `hostState` is what the host row records ('Shared' for Borrow, 'Requested' for Request);
// `copyState` is what the borrower's copy carries ('Borrowed' or 'Requested').
function _startLoan(hostState, copyState) {
  const name = fv('sp-borrower');
  if (!name) { alert('Please enter a name.'); return; }
  const hostLab = editLab || activeLab;        // the item's owning lab
  const borrowingLab = activeLab;              // the lab the borrower is logged into
  const borrowerRaw = encodeBorrower(name, borrowingLab);
  const host = modalFind(editIdx);
  const borrowed = $('sp-date').value || '';
  commitAndClose(item => {
    item.Borrower = borrowerRaw;
    item.Borrowed = borrowed;
    updateSharing(item, hostState);
  });
  if (host && borrowingLab !== hostLab) {
    host.Borrowed = borrowed;
    writeBorrowedCopy(host, hostLab, borrowingLab, copyState, borrowerRaw);
  }
}
function borrowItem()  { _startLoan('Shared',    'Borrowed'); }
function requestItem() { _startLoan('Requested', 'Requested'); }
// Accept/Deny share the same head: a host-side action on a Requested item, where the
// borrower's copy is identified via parseBorrower(host.Borrower). `hostMutator` updates
// the host row; `copyChanges` is what gets applied to the borrower's copy.
function _resolveRequest(hostMutator, copyChanges) {
  const host = modalFind(editIdx);
  const hostLab = editLab || activeLab;
  const bi = host ? parseBorrower(host.Borrower) : { lab:'' };
  const match = host ? _loanMatch(host) : null;
  commitAndClose(hostMutator);
  if (match && bi.lab) syncCopy(bi.lab, hostLab, match, copyChanges);
}
// Accept → host Sharing='Shared', copy Sharing='Borrowed'. Policy untouched (its own column).
function acceptRequest() {
  _resolveRequest(item => updateSharing(item, 'Shared'), { Sharing:'Borrowed' });
}
// Deny → host Sharing cleared (idle), copy Sharing='Denied' (awaiting Acknowledge).
function denyRequest() {
  _resolveRequest(item => { item.Borrower = ''; item.Borrowed = ''; updateSharing(item, ''); },
                  { Sharing:'Denied' });
}

// Borrower acknowledges a denial → soft-delete their copy (Status='Deleted' hides it).
function acknowledgeDenied() {
  const item = modalFind(editIdx);
  if (!item) return;
  item.Status = 'Deleted';
  item._deleted = true;
  persistItem(item);
  closeEditModal(true); buildFilterOptions(); applyFilters();
}

// Resolve the (borrowingLab, hostLab) pair for the open item, working from EITHER side:
//  - Host row: lives in the host lab (editLab/activeLab); borrowing lab parsed from the
//    encoded Borrower "Name (Lab)".
//  - Borrowed copy: Vendor holds the host lab name; the borrowing lab is the current lab.
function sharingPeers(item) {
  if (!item) return { borrowingLab:'', hostLab:'' };
  if (isBorrowedCopy(item)) {
    return { borrowingLab: activeLab, hostLab: (item.Vendor || '').trim() };
  }
  return { borrowingLab: parseBorrower(item.Borrower).lab, hostLab: (editLab || activeLab) };
}

// ── Sharing transition primitives ─────────────────────────────────────
// Both ends of an active loan transition together. The two patterns:
//   loanStateChange — the loan stays active; both host Sharing and copy Sharing get the
//                     same new value (IOU, Bring Back).
//   endLoan         — the loan ends; host goes idle (Sharing/Borrower/Borrowed cleared),
//                     copy is soft-deleted (Status='Deleted').
// Each primitive works from EITHER side: when invoked from a borrowed copy it drives the
// host row via syncHost; when from the host row it writes locally and syncs the copy.

function _loanMatch(item) {
  return { Name:item.Name, Catalog:item.Catalog, Borrowed:item.Borrowed, Borrower:item.Borrower };
}

function loanStateChange(item, newSharing) {
  const { borrowingLab, hostLab } = sharingPeers(item);
  const match = _loanMatch(item);
  if (isBorrowedCopy(item)) {
    syncHost(borrowingLab, hostLab, match, { Sharing: newSharing });
    item.Sharing = newSharing;
    persistItem(item);
  } else {
    item.Sharing = newSharing;
    persistItem(item);
    if (borrowingLab) syncCopy(borrowingLab, hostLab, match, { Sharing: newSharing });
  }
}

function endLoan(item) {
  const { borrowingLab, hostLab } = sharingPeers(item);
  const match = _loanMatch(item);
  if (isBorrowedCopy(item)) {
    syncHost(borrowingLab, hostLab, match, { Sharing:'', Borrower:'', Borrowed:'' });
    item.Status = 'Deleted'; item._deleted = true;
    persistItem(item);
    closeEditModal(true); buildFilterOptions(); applyFilters();
  } else {
    commitAndClose(it => {
      it.Borrower = ''; it.Borrowed = '';
      updateSharing(it, '');
    });
    if (borrowingLab) syncCopy(borrowingLab, hostLab, match, { Status:'Deleted' });
  }
}

// Return: borrower ends an active loan (Shared or Bring Back). Host → idle, copy → Deleted.
function returnItem()    { const it = modalFind(editIdx); if (it) endLoan(it); }
// Resolve: host force-ends IOU / Bring Back. Same end-state as Return.
function resolveSharing(){ const it = modalFind(editIdx); if (it) endLoan(it); }
// IOU: borrower flags they consumed/owe the item. Both sides → Sharing='IOU'.
function iouItem() {
  const it = modalFind(editIdx); if (!it) return;
  loanStateChange(it, 'IOU');
  populateForm(it); configureActionForStatus(it, false); renderLocPanel(it); applyFilters();
}
// Bring Back: host recalls a Shared item. Both sides → Sharing='Bring Back'.
function bringBackItem() {
  const it = modalFind(editIdx); if (!it) return;
  loanStateChange(it, 'Bring Back');
  populateForm(it); configureActionForStatus(it, false); renderLocPanel(it); applyFilters();
}

function propagateBox1Rename(oldKey, newBox1, sourceId) {
  // Only rename siblings that shared the FULL old location path — not just the box label.
  const affected = items.filter(i => i._id !== sourceId && sameBoxKey(i, oldKey));
  if (!affected.length) return;
  if (!confirm(`Rename box "${oldKey.Box1}" to "${newBox1}" for all ${affected.length} other item(s) in this box?`)) return;
  affected.forEach(sib => { sib.Box1 = newBox1; persistItem(sib); });
}

// Offer to move the item's physical group to the new Room. The group shares the same
// location path: for a boxed item that's Location1+Location2+Box1; for a loose item it's
// Location1+Location2 (sameBoxKey handles both since it compares all three, and a loose
// item has an empty Box1 that matches other loose items in the same sub-location).
function propagateRoom(source, oldRoom) {
  const affected = items.filter(i => i._id !== source._id && sameBoxKey(i, source));
  if (!affected.length) return;
  const from  = oldRoom || '(none)';
  const to    = source.Room || '(none)';
  const where = source.Box1 ? 'box' : 'location';
  if (!confirm(`Move all ${affected.length} other item(s) in this ${where} to Room "${to}" (from "${from}")?`)) return;
  affected.forEach(sib => { sib.Room = source.Room; persistItem(sib); });
}

function propagateGridXY(source) {
  const dims = parseGridXY(source.GridXY);
  items.forEach(sib => {
    if (sib._id === source._id || !sameBoxKey(sib, source)) return;
    sib.GridXY = source.GridXY;
    if (dims) {
      const valid = box2Coords(sib.Box2).filter(coord => {
        const col = parseInt(coord.slice(1), 10);
        const row = coord.charCodeAt(0) - 65;
        return col >= 1 && col <= dims.cols && row >= 0 && row < dims.rows;
      });
      const lists = box2ListCount(sib.Box2);
      sib.Box2 = encodeBox2([...valid, ...Array(lists).fill('0')]);
    }
    persistItem(sib);
  });
}

// ── Setup ──────────────────────────────────────────────────────────────
function openSetup() {
  // Default-deploy URL — hard-coded for this distribution. Stored value still wins if
  // someone has pointed at a different sheet.
  const DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbyOoLJvGwQuqVRLz1x9lOPV4mwwFCqDfjjf2wo-QYvaLBIG6MpNyJQA5pfsXCYHgVPY/exec';
  $('setup-url').value = API_URL || DEFAULT_URL;
  $('setup-pw').value = '';
  $('setup-new-lab').value = '';
  $('setup-new-lab').style.display = 'none';
  const sel = $('setup-lab');
  sel.innerHTML = '';
  if (!defaultLab) {
    const opt = document.createElement('option');
    opt.value = ''; opt.textContent = '— Select a lab —';
    sel.appendChild(opt);
  }
  LAB_NAMES.forEach(name => {
    const opt = document.createElement('option');
    opt.value = name; opt.textContent = name;
    if (name === defaultLab) opt.selected = true;
    sel.appendChild(opt);
  });
  const newOpt = document.createElement('option');
  newOpt.value = '__new__'; newOpt.textContent = '— New —';
  sel.appendChild(newOpt);
  sel.onchange = onSetupLabChange;
  $('setup-overlay').classList.add('open');
}

// When "— New —" is picked in Setup, reveal an inline input for the new lab name.
function onSetupLabChange() {
  const sel = $('setup-lab');
  const inp = $('setup-new-lab');
  if (sel.value === '__new__') {
    inp.style.display = '';
    inp.value = '';
    setTimeout(() => inp.focus(), 0);
  } else {
    inp.style.display = 'none';
  }
}

function closeSetup() { $('setup-overlay').classList.remove('open'); }
function saveSetup() {
  const url = fv('setup-url');
  let lab   = $('setup-lab').value;
  if (!url) { alert('Please enter a URL.'); return; }
  if (lab === '__new__') {
    lab = (fv('setup-new-lab') || '').trim();
    if (!lab) { alert('Please enter a name for the new lab.'); return; }
  }
  if (!lab) { alert('Please choose your default lab.'); return; }

  // Setting or changing the default lab requires the PI password (the lab's name,
  // case-insensitive). The user enters it inline rather than via a popup.
  const labChanging = (lab !== defaultLab);
  if (labChanging) {
    const pw = (fv('setup-pw') || '').trim();
    if (!pw) { alert(`Enter the ${lab} lab PI password to set this as your lab.`); return; }
    if (pw.toLowerCase() !== lab.toLowerCase()) {
      alert('Incorrect password. Lab not changed.');
      return;
    }
    if (defaultLab && !confirm(`Switch default lab from ${defaultLab} to ${lab}? The page will reload.`)) {
      return;
    }
  }

  localStorage.setItem(KEY_URL, url);
  localStorage.setItem(KEY_DEFAULT_LAB, lab);
  localStorage.setItem(KEY_ACTIVE_LAB, lab);
  location.reload();
}
function clearSetup() {
  if (!confirm('Disconnect from the data source? The page will reload empty.')) return;
  localStorage.removeItem(KEY_URL);
  localStorage.removeItem(KEY_DEFAULT_LAB);
  localStorage.removeItem(KEY_ACTIVE_LAB);
  location.reload();
}

// ── Export ─────────────────────────────────────────────────────────────
function exportCSV() {
  const headers = ['Vendor','Catalog','Price','Name','Type','Size','Received',
    'Stock','Threshold','Room','Location1','Location2','Box1','GridXY','Box2',
    'Sharing','Borrower','Borrowed','Notes','CAS','SDS','URL','Status'];
  const rows = items.map(item =>
    headers.map(h => {
      const v = String(h === 'Stock' ? getStock(item) : (item[h] || ''));
      return /[,"\n\r]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v;
    }).join(',')
  );
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent([headers.join(','), ...rows].join('\n'));
  a.download = 'inventory.csv'; a.click();
}

// ── Grid cell tooltip ──────────────────────────────────────────────────
(function() {
  const tip = $('grid-tip');
  if (!tip) return;
  document.addEventListener('mousemove', e => {
    if (tip.style.display === 'none') return;
    tip.style.left = (e.clientX + 14) + 'px';
    tip.style.top  = (e.clientY -  6) + 'px';
  });
  document.addEventListener('mouseover', e => {
    const cell = e.target.closest('[data-tip]');
    if (!cell) { tip.style.display = 'none'; return; }
    tip.textContent = cell.dataset.tip;
    tip.style.display = 'block';
    tip.style.left = (e.clientX + 14) + 'px';
    tip.style.top  = (e.clientY -  6) + 'px';
  });
  document.addEventListener('mouseout', e => {
    if (e.target.closest('[data-tip]')) tip.style.display = 'none';
  });
})();

// ── Boot ───────────────────────────────────────────────────────────────
(async () => {
  API_URL    = localStorage.getItem(KEY_URL)         || '';
  defaultLab = localStorage.getItem(KEY_DEFAULT_LAB) || '';
  // Lab is set from Setup only. The active lab always equals the home lab.
  activeLab  = defaultLab;
  applyLabBranding();
  await loadData();
})();

// Reflect the home lab in the page title and the search-box placeholder.
function applyLabBranding() {
  const title = $('app-title');
  if (title) {
    title.innerHTML = defaultLab
      ? `Inventory <span>Explorer</span> — ${esc(defaultLab)} Lab`
      : `Inventory <span>Explorer</span>`;
  }
  const box = $('search-box');
  if (box && searchScope === 'local') {
    box.placeholder = defaultLab ? `Search ${defaultLab} Lab` : 'Search…';
  }
  // Keep the scope toggle label correct on load (it only updated on toggle before,
  // so a fresh page showed the stale static text).
  const btn = $('scope-toggle');
  if (btn) btn.textContent = (searchScope === 'everywhere') ? 'Search All' : 'Search Lab';
}
</script>
</body>
