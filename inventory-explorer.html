<!DOCTYPE html>
<html lang="en">
<head>
<meta name="color-scheme" content="light">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --paper:#fff;--bord:#ccc8c0;--ink:#1a1714;--mut:#888078;
  --vb-lo:#bdd9f5;--vb-lo-b:#8bbfe8;--vb-hi:#2c7bb6;--vb-hi-b:#1d5a8a;
  --ok:#35974a;--ok-lo:#b8de8a;--ok-b:#1e6b33;
  --warn:#f07000;--warn-lo:#ffd0a0;--warn-b:#c05000;
  --danger:#b00000;--danger-lo:#ffb0b0;
  --yellow:#c49b00;--yellow-lo:#fde68a;--yellow-b:#8a6d00;
}
*{box-sizing:border-box;margin:0;padding:0;forced-color-adjust:none;}
html,body{height:100%;font-family:'DM Mono',monospace;font-size:14px;color:var(--ink);background:#fff !important;}
@media (prefers-color-scheme: dark){
  html,body,#topnav,#subnav,#content,.inv-table,.inv-table td,.inv-table th,
  .modal-box,.modal-col-left,.modal-col-right,
  .form-field input,.form-field select,.form-field textarea,
  .btn,.nbtn,.filter-select,#search-box{background-color:#fff !important;color:var(--ink) !important;}
}
/* Lock the viewport so the top bar and footer cannot be scrolled out of view on iPad
   or other mobile browsers. Two pieces:
     - html, body: position:fixed + overflow:hidden prevents any rubber-band scrolling
       of the page itself; scrolling only happens inside #content.
     - #app: 100dvh (dynamic viewport height) sizes the app to the *visible* area on
       browsers whose chrome can collapse/expand (fallback 100vh for older browsers). */
html, body{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

#topnav{display:flex;align-items:center;padding:6px 18px;gap:7px;background:var(--paper);border-bottom:1px solid var(--bord);flex-shrink:0;}
.logo{font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);margin-right:10px;white-space:nowrap;}
.logo span{color:var(--mut);}
.nav-spacer{flex:1;}

#subnav{display:flex;align-items:center;padding:4px 18px;gap:7px;background:var(--paper);border-bottom:1px solid var(--bord);flex-shrink:0;flex-wrap:wrap;}
.filter-group{display:flex;align-items:center;gap:5px;}
.filter-group label{font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;}
.filter-select{padding:3px 8px;border-radius:2px;font-size:14px;border:1px solid var(--bord);background:var(--paper);font-family:'DM Mono',monospace;color:var(--ink);cursor:pointer;outline:none;}
.filter-sep{width:1px;height:20px;background:var(--bord);margin:0 2px;}
#search-box{margin-left:auto;padding:3px 10px;border-radius:2px;font-size:14px;border:1px solid var(--bord);background:var(--paper);font-family:'DM Mono',monospace;color:var(--ink);width:220px;outline:none;}
#search-box:focus{border-color:var(--ink);}
.lab-group-row td{padding:10px 8px 4px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);border-top:2px solid var(--bord);border-bottom:1px solid var(--bord);}
.lab-group-row.foreign td{color:var(--mut);}
.modal-box.read-only :disabled{opacity:.55;cursor:not-allowed;}
.modal-box.read-only #sec-sharing :disabled{opacity:1;cursor:auto;}
/* Search-All mode: only the toggle button is highlighted blue — the toolbar and search
   box stay neutral so the indicator is a clear, contained signal. */
.scope-local{border-color:var(--vb-lo-b);}
.scope-everywhere{background:var(--vb-hi) !important;border-color:var(--vb-hi-b) !important;color:#fff !important;}

#content{flex:1;overflow-y:auto;padding:18px;background:#fff !important;}

.inv-table{width:100%;border-collapse:collapse;font-size:14px;background:#fff;}
.inv-table th{text-align:left;padding:6px 8px;font-weight:400;font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--bord);position:sticky;top:0;background:var(--paper);z-index:1;cursor:pointer;user-select:none;white-space:nowrap;box-shadow:0 1px 0 var(--bord);}
.inv-table th:hover{color:var(--ink);}
.inv-table th.sort-asc::after{content:' ▲';font-size:12px;}
.inv-table th.sort-desc::after{content:' ▼';font-size:12px;}
.inv-table th.no-sort{cursor:default;}
.inv-table th.no-sort:hover{color:var(--mut);}
.inv-table td{padding:6px 8px;border-bottom:1px solid #f0ede8;vertical-align:top;background:#fff;}
.inv-table tr:hover td{background:#faf9f7 !important;}
.section-hdr td{padding:10px 8px 4px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);border-top:2px solid var(--bord);border-bottom:1px solid var(--bord);}

.item-name a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--bord);}
.item-name a:hover{border-bottom-color:var(--ink);}
.item-sub{color:var(--mut);font-size:12px;margin-top:2px;}
.loc-sub{color:var(--mut);font-size:12px;}
.borrower-sub{color:var(--mut);font-size:12px;margin-top:3px;font-style:italic;}

.status-btn{display:inline-block;box-sizing:border-box;width:120px;text-align:center;padding:1px 7px;border-radius:2px;font-size:14px;line-height:1.4;cursor:pointer;font-family:'DM Mono',monospace;border:1px solid var(--bord);background:var(--paper);color:var(--ink);white-space:nowrap;letter-spacing:.03em;}
.status-btn.in-stock    {background:var(--paper);border-color:var(--bord);color:var(--ink);}
.status-btn.order-now,
.status-btn.requested   {background:var(--warn);border-color:var(--warn-b);color:#fff;}
.status-btn.on-order    {background:var(--warn);border-color:var(--warn-b);color:#fff;}
.status-btn.arrived     {background:var(--warn);border-color:var(--warn-b);color:#fff;}
.status-btn.shared      {background:var(--ok);border-color:var(--ok-b);color:#fff;}
.status-btn.out-of-stock{background:var(--danger);border-color:#800000;color:#fff;}
.status-btn.bring-back  {background:#e60000;border-color:#b30000;color:#fff;}
.status-btn.archived    {background:#b0a898;border-color:#888078;color:#fff;}

.stock-cell{display:flex;align-items:center;gap:4px;white-space:nowrap;}
.stock-num{min-width:28px;text-align:center;font-size:14px;border:1px solid transparent;border-radius:2px;padding:0 2px;}
.stock-num:focus{border-color:var(--bord);outline:none;}
.stock-num.readonly{cursor:not-allowed;color:var(--mut);}
.stock-ok    {color:var(--ok);}
.stock-warn  {color:var(--warn);}
.stock-danger{color:var(--danger);}

.btn{padding:5px 14px;border-radius:2px;font-size:14px;line-height:1.4;cursor:pointer;font-family:'DM Mono',monospace;border:1px solid var(--bord);background:var(--paper);color:var(--ink);}
.btn:hover{background:#f0ede8;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-primary{background:var(--vb-hi)!important;color:#fff!important;border-color:var(--vb-hi-b)!important;}
.btn-primary:hover{background:var(--vb-hi-b)!important;}
.btn-ok,.btn-borrow{background:var(--ok)!important;color:#fff!important;border-color:var(--ok-b)!important;}
.btn-ok:hover,.btn-borrow:hover{background:var(--ok-b)!important;}
.btn-danger{background:#e03030!important;color:#fff!important;border-color:var(--danger)!important;}
.btn-danger:hover{background:var(--danger)!important;}
.btn-order{background:var(--warn)!important;color:#fff!important;border-color:var(--warn-b)!important;}
.btn-order:hover{background:var(--warn-b)!important;}
.btn-ask{background:var(--yellow)!important;color:#fff!important;border-color:var(--yellow-b)!important;}
.btn-ask:hover{background:var(--yellow-b)!important;}
.btn-sm{padding:5px 10px!important;}
.nbtn{padding:5px 10px;border-radius:2px;font-size:14px;line-height:1.4;cursor:pointer;border:1px solid var(--vb-lo-b);background:var(--vb-lo);color:var(--ink);font-family:'DM Mono',monospace;}
.nbtn:hover{background:var(--vb-lo-b);}

/* ── Modal ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal-box{background:var(--paper);border:1px solid var(--bord);border-radius:3px;display:flex;flex-direction:row;max-height:90vh;width:920px;overflow:visible;}
.modal-col-left{width:310px;flex-shrink:0;padding:22px;display:flex;flex-direction:column;overflow-y:auto;max-height:90vh;}
.modal-col-right{flex:1;padding:22px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;min-width:0;max-height:90vh;}
.modal-box h2{font-size:14px;font-weight:400;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:16px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.form-row-3{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin-top:8px;align-items:start;}
.form-row-3 .form-field{min-width:0;}
.form-full{grid-column:1/-1;}
.form-field label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em;}
.form-field input,.form-field select,.form-field textarea{width:100%;padding:4px 7px;border:1px solid var(--bord);border-radius:2px;font-family:'DM Mono',monospace;font-size:14px;color:var(--ink);background:var(--paper);outline:none;}
.form-field input[type="date"]{width:auto;max-width:150px;}
.field-with-view{display:flex;gap:4px;align-items:center;}
.field-with-view .combo-wrap{flex:1;min-width:0;}
.field-with-view > input{flex:1;min-width:0;}
/* Link buttons (SDS / URL) carry a subtle blue tint to read as an "open" affordance,
   distinct from the neutral eye/view buttons. */
.link-btn{color:var(--vb-hi);border-color:var(--vb-hi-b);}
.link-btn:not(:disabled):hover{background:var(--vb-hi);color:#fff;}
.view-btn{flex:0 0 auto;width:28px;height:28px;padding:0!important;display:inline-flex;align-items:center;justify-content:center;}
.view-btn.is-active{background:var(--vb-hi)!important;color:#fff!important;border-color:var(--vb-hi-b)!important;}
.view-btn:disabled{opacity:.35;cursor:not-allowed;}
.view-btn svg{width:18px;height:18px;display:block;}

/* Location section: blue background + divider between form fields and the box/list view. */
#sec-location{background:var(--vb-lo) !important;border-color:var(--vb-lo-b);}
#sec-location > #loc-panel-wrap{margin-top:10px;padding-top:10px;border-top:1px solid var(--bord);}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--ink);}
.combo-wrap{display:flex;flex-direction:column;gap:2px;}
.combo-sel,.combo-inp{width:100%;padding:4px 7px;border:1px solid var(--bord);border-radius:2px;font-family:'DM Mono',monospace;font-size:14px;color:var(--ink);background:var(--paper);outline:none;}
.combo-sel{cursor:pointer;}
.combo-sel:focus,.combo-inp:focus{border-color:var(--ink);}
.combo-back{font-size:11px;color:var(--mut);cursor:pointer;text-decoration:underline;align-self:flex-start;}
.combo-back:hover{color:var(--ink);}
.form-field textarea{resize:vertical;min-height:80px;}

/* ── Three-section left column ───────────────────────────────────────── */
.sec-card{border:1px solid var(--bord);border-left:3px solid var(--mut);border-radius:3px;padding:10px 12px;margin-bottom:10px;background:#fafaf8;}
.sec-card:last-child{margin-bottom:0;}
/* Safety section: red accent to draw the eye to safety info. Same thick left border as
   every panel, but red + a faint red wash + red title. */
.sec-safety{border-color:var(--danger);border-left:3px solid var(--danger);background:#f7e9e9;}
.sec-safety .sec-title{color:var(--danger);}
/* Safety row: three equal columns — CAS, SDS, Description. */
.safety-grid{grid-template-columns:1fr 1fr 1fr !important;}
.sec-title{font-size:14px;font-weight:400;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);margin-bottom:8px;}
/* Modal action bar — 4 equal-width slots. Each visible button takes equal share of the
   row width via flex:1, with a small gap providing breathing room. Buttons hidden by
   display:none also drop out of the flex layout, so when fewer buttons are visible
   (e.g. archived mode with 2) those remaining buttons take a proportionally larger share. */
.modal-bottom-actions{display:flex;align-items:center;gap:8px;padding:10px 0 0;flex-shrink:0;}
.modal-bottom-actions > button{flex:1;min-width:0;}
/* The left column flexes vertically and the Notes textarea absorbs leftover space so the
   modal stays a clean rectangle regardless of which side has more content. */
/* Left column layout. Aim: when the modal grows taller (to match the right column),
   the Information form's rows keep their compact natural spacing — only the Notes
   textarea expands to soak up the extra height, so the form doesn't look stretched. */
.modal-col-left{display:flex;flex-direction:column;}
.modal-col-left #sec-info{display:flex;flex-direction:column;flex:1;min-height:0;}
/* Positional row sizing: every row stays at its natural (auto) height EXCEPT the Notes
   row, which is 1fr (absorbs leftover vertical space). Current row order:
     1: Name (full)
     2: Vendor / Catalog
     3: Size / Type
     4: Container / URL
     5: Notes (full)            ← this is the 1fr row
     6: Price / Date
     7: Stock / Threshold
   If a row is added or removed from the Information form, update the template. */
.modal-col-left #sec-info .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1;
  grid-template-rows: auto auto auto auto 1fr auto auto;}
/* The Notes form-field cell expands to fill its grid row; the textarea inside fills the cell. */
.modal-col-left .form-full:has(#f-notes-text){display:flex;flex-direction:column;min-height:0;}
#f-notes-text{flex:1;min-height:60px;resize:none;}

/* ── Sharing & Location panels ── */
/* Sharing card carries the policy accent on the card itself, not a nested panel. */
.sec-card.policy-yes{background:var(--ok-lo) !important;border-color:var(--ok);}
.sec-card.policy-ask{background:var(--yellow-lo) !important;border-color:var(--yellow);}
.sec-card.policy-iou{background:var(--danger-lo) !important;border-color:var(--danger);}
.sec-card.policy-yes .sec-title{color:var(--ok);}
.sec-card.policy-ask .sec-title{color:var(--yellow-b);}
.sec-card.policy-iou .sec-title{color:var(--danger);}
/* Sharing panel: every state fits on a single horizontal row. Inputs use placeholders
   (no labels) so the row stays one line tall. */
.sharing-row{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;}
.sharing-row .sp-inp{padding:4px 7px;border:1px solid var(--bord);border-radius:2px;
  font-family:'DM Mono',monospace;font-size:14px;color:var(--ink);background:var(--paper);outline:none;min-width:0;}
.sharing-row .sp-inp:focus{border-color:var(--ink);}
.sharing-row .sp-inp-name{flex:1;}
.sharing-row .sp-inp-date{width:140px;flex:0 0 auto;}
.sharing-row .btn{flex:0 0 auto;}
.muted-italic{font-size:14px;color:var(--mut);font-style:italic;}
/* End of sharing panel CSS */

/* Box/list view lives directly inside the Location section card — no inner panel wrapper. */
.loc-inner{display:flex;flex-direction:column;}

/* Grid */
.grid-outer{overflow:auto;margin-bottom:8px;}
.grid-col-labels{display:flex;margin-left:26px;gap:2px;margin-bottom:2px;}
.grid-col-lbl{width:28px;text-align:center;font-size:12px;color:var(--mut);}
.grid-row{display:flex;align-items:center;gap:2px;margin-bottom:2px;}
.grid-row-lbl{width:22px;font-size:12px;color:var(--mut);text-align:right;padding-right:4px;flex-shrink:0;}
.grid-cell{width:28px;height:28px;background:var(--paper);border:1px solid var(--bord);border-radius:2px;display:flex;align-items:center;justify-content:center;cursor:default;position:relative;flex-shrink:0;transition:background .1s;}
.grid-cell.c-placing{cursor:crosshair;background:#f0f8ff;}
.grid-cell.c-placing:hover{background:#d0ecff;border-color:var(--vb-hi);}
.grid-cell.c-occupied{cursor:pointer;}
.grid-cell.c-staged{background:#d4edda;border-color:var(--ok);}
.grid-marker{width:22px;height:22px;border-radius:2px;background:var(--mut);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:500;letter-spacing:-.02em;overflow:hidden;}
/* `mk-owned` highlights every cell occupied by the item currently focused on the left
   side of the modal — a softer, persistent indicator of "this is the item you're
   editing." `mk-active` is the stronger highlight for the one specifically-clicked
   coord (used for Use / move-to-empty-cell). They can compose: the selected cell of
   the focused item gets the full strong color. */
.grid-marker.mk-owned{background:var(--vb-lo-b);}
.grid-marker.mk-active{background:var(--vb-hi);}

#grid-tip{display:none;position:fixed;background:var(--ink);color:#fff;font-size:12px;padding:4px 8px;border-radius:2px;white-space:nowrap;pointer-events:none;z-index:500;font-family:'DM Mono',monospace;}

/* List mode */
.box-list{display:flex;flex-direction:column;gap:3px;margin-bottom:8px;}
.box-list-hdr{font-size:11px;font-weight:700;color:var(--mut);margin:6px 0 2px;text-transform:uppercase;letter-spacing:.04em;}
.bli{display:flex;align-items:center;gap:8px;padding:5px 8px;border:1px solid var(--bord);border-radius:2px;background:var(--paper);font-size:14px;cursor:pointer;}
.bli:hover{background:#f0ede8;}
.bli.bli-active{background:#e8f4fd;border-color:var(--vb-lo-b);}
.bli.bli-unplaced{border-style:dashed;color:var(--mut);}
.bli-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bli-status{font-size:12px;color:var(--mut);white-space:nowrap;}

#footer{padding:8px 18px;border-top:1px solid var(--bord);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--mut);background:var(--paper);}
#footer a{color:var(--mut);text-decoration:none;border-bottom:1px solid var(--bord);}
#footer a:hover{color:var(--ink);border-bottom-color:var(--ink);}

.empty{padding:40px;text-align:center;color:var(--mut);}

/* Setup modal */
#setup-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center;}
#setup-overlay.open{display:flex;}
.setup-box{background:#fff;border:1px solid var(--bord);border-radius:3px;padding:28px;width:480px;max-width:90vw;}
.setup-box h2{font-size:14px;font-weight:400;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:16px;}
.setup-actions{display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid var(--bord);}
</style>
</head>
<body>
<div id="app">

<div id="topnav">
  <div class="logo" id="app-title">Inventory <span>Explorer</span></div>
  <div class="nav-spacer"></div>
  <button class="nbtn" onclick="exportCSV()">Download CSV</button>
  <button class="nbtn" onclick="openSetup()">Setup</button>
</div>

<div id="subnav">
  <div class="filter-group"><label>Vendor</label>
    <select class="filter-select" id="filter-vendor" onchange="applyFilters()"><option value="">All</option></select></div>
  <div class="filter-group"><label>Type</label>
    <select class="filter-select" id="filter-type" onchange="applyFilters()"><option value="">All</option></select></div>
  <div class="filter-group"><label>Location</label>
    <select class="filter-select" id="filter-loc" onchange="applyFilters()"><option value="">All</option></select></div>
  <div class="filter-group"><label>Box</label>
    <select class="filter-select" id="filter-box" onchange="applyFilters()"><option value="">All</option></select></div>
  <button class="btn" style="font-size:14px;padding:3px 8px;" onclick="clearFilters()">Clear</button>
  <div class="filter-sep"></div>
  <button class="btn btn-ok" style="font-size:14px;padding:3px 10px;" onclick="openAddModal()">New</button>
  <input id="search-box" type="text" placeholder="Searching…" oninput="applyFilters()">
  <button id="scope-toggle" class="btn scope-local" style="font-size:14px;padding:3px 10px;white-space:nowrap;" onclick="toggleSearchScope()">Search Lab</button>
</div>

<div id="content">
  <table class="inv-table" id="inv-table">
    <thead><tr>
      <th class="no-sort" style="width:120px;">Status</th>
      <th onclick="sortBy('Stock')" data-col="Stock" style="width:90px;">Stock</th>
      <th onclick="sortBy('Name')"  data-col="Name">Name</th>
      <th onclick="sortBy('Type')"  data-col="Type">Type</th>
      <th onclick="sortBy('Location1')" data-col="Location1">Location</th>
    </tr></thead>
    <tbody id="inv-body"></tbody>
  </table>
</div>

<div id="footer">
  <span id="section-counts"></span>
  <span>Made by <a href="https://stevanspringer.github.io" target="_blank" rel="noopener">Springer Lab</a> · UPEI Biology · Copyright <a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a></span>
</div>
</div>

<div id="grid-tip"></div>

<!-- Setup Modal -->
<div id="setup-overlay">
  <div class="setup-box">
    <h2>Setup — Data Source</h2>
    <div class="form-field" style="margin-bottom:16px;">
      <label>Google Apps Script URL</label>
      <input id="setup-url" type="text" value="https://script.google.com/macros/s/AKfycbyOoLJvGwQuqVRLz1x9lOPV4mwwFCqDfjjf2wo-QYvaLBIG6MpNyJQA5pfsXCYHgVPY/exec" placeholder="https://script.google.com/macros/s/…/exec">
    </div>
    <div class="form-field" style="margin-bottom:16px;">
      <label>Default Lab</label>
      <select id="setup-lab" style="width:100%;padding:6px 8px;font-family:'DM Mono',monospace;font-size:14px;border:1px solid var(--bord);border-radius:2px;background:var(--paper);"></select>
      <input id="setup-new-lab" type="text" placeholder="Name for the new lab" style="display:none;margin-top:6px;">
    </div>
    <div class="form-field" style="margin-bottom:16px;">
      <label>PI password</label>
      <input id="setup-pw" type="password" placeholder="Required to set or change lab" autocomplete="off">
    </div>
    <div class="setup-actions">
      <button class="btn" onclick="closeSetup()">Cancel</button>
      <div style="display:flex;gap:8px;">

<script>
'use strict';

// ── Constants ──────────────────────────────────────────────────────────
const KEY_URL         = 'inv_api_url';
const KEY_DEFAULT_LAB = 'inv_default_lab';
const KEY_ACTIVE_LAB  = 'inv_active_lab';
const KEY_CACHE_PFX   = 'inv_cache_';      // + labName → JSON { ts, items }

// Read a lab's cached items from localStorage. Returns null on miss/corruption.
function readLabCache(lab) {
  try {
    const raw = localStorage.getItem(KEY_CACHE_PFX + lab);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    return Array.isArray(obj.items) ? obj.items : null;
  } catch(e) { return null; }
}
// Write a lab's items to localStorage. Quota/serialise failures are non-fatal.
function writeLabCache(lab, rawItems) {
  try {
    localStorage.setItem(KEY_CACHE_PFX + lab,
      JSON.stringify({ ts: Date.now(), items: rawItems }));
  } catch(e) { /* quota exceeded or unavailable — silently skip caching */ }
}
const LOCKED_ST       = new Set(['on order','arrived','archived']);
const COMBO_NEW       = '\u2014 New \u2014';

// Lab list — each entry is both a Google Sheet tab name and the PI confirmation code
// for that lab. The list is ordered alphabetically (matching the dropdown).
const LAB_NAMES = ['Biology', 'Deziel', 'Gray', 'Lacroix', 'Ladouceur', 'Murphy',
  'Quijon', 'Robicheau', 'Ross', 'Seib', 'Silva-Opps', 'Springer', 'van den Heuvel'];

// PI confirmation code for sharing-policy changes and IOU acceptance.
// Each lab's code is just the lab name itself. The active lab determines which code is valid.
// PI confirmation code for sharing-policy changes and IOU acceptance. While a modal is open,
// the relevant code is the OWNING lab of that item (editLab) — which may differ from the
// lab currently being browsed when the item was opened from a cross-lab search.

// Field lists used by both populate and serialise paths
const TEXT_FIELDS  = ['Name','Catalog','Price','Size','CAS','Safety','SDS','URL'];
const COMBO_FIELDS = ['f-vendor','f-container','f-type','f-location','f-subloc','f-box1','f-room'];

// ── State ──────────────────────────────────────────────────────────────
let items     = [];
let filtered  = [];
let sortCol   = 'Name';
let sortDir   = 1;
let editIdx   = null;   // _id of item in modal
let editLab   = '';     // lab that owns the modal's item (may differ from activeLab)
let editReadOnly = false; // true when viewing a foreign lab's item: details locked, sharing live
let useSheets = false;
let API_URL   = '';
let nextId    = 0;      // monotonic — never reused after delete

// Lab routing state — set on load from localStorage, mutated by the top-bar dropdown.
let defaultLab = '';   // the user's home lab (their data + the gate for hiding Sharing UI)
let activeLab  = '';   // the lab currently being viewed

// Cross-lab search ("Searching everywhere") state.
let searchScope   = 'local';   // 'local' | 'everywhere'
let crossLabItems = {};        // { labName: [items] } accumulated during an everywhere search
let crossLabSeq   = 0;         // bumped each everywhere search to discard stale fetch results

// Location selection: { coord } | null  — the current item's selected box cell.
// coord is a grid coordinate like 'A1', or the sentinel '0' for an unplaced unit.
let locSelected = null;
let locView     = null;  // breadcrumb drill-down: null | { loc1, loc2? }

// ── DOM helpers ────────────────────────────────────────────────────────
const $  = id => document.getElementById(id);
const fv = id => ($(id) ? $(id).value.trim() : '');
const fn = id => parseInt(($(id) || {}).value, 10);

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Main-table location display: "Location 1 (Room)" — Room in parens, omitted when empty.
function loc1WithRoom(item) {
  const l1 = esc(item.Location1 || '');
  const rm = (item.Room || '').trim();
  return rm ? `${l1} (${esc(rm)})` : l1;
}

// ── API ────────────────────────────────────────────────────────────────
async function apiRead() {
  try {
    // The Apps Script will auto-create the tab if it doesn't exist.
    const r = await fetch(API_URL + '?action=read&lab=' + encodeURIComponent(activeLab));
    const d = await r.json();
    if (d.error) { console.warn('API read returned error:', d.error); return null; }
    if (d.items) return d.items;
  } catch(e) { console.warn('API read failed', e); }
  return null;
}
// Date fields must persist as bare YYYY-MM-DD. Sheets/JSON round-trips otherwise inject
// time components ("2024-10-01T00:00:00.000Z"), which break exact-match identity lookups
// and clutter the sheet. Scrubbed centrally so EVERY write path is covered.
function scrubItemDates(item) {
  if (!item || typeof item !== 'object') return item;
  ['Received','Borrowed'].forEach(k => {
    if (item[k] != null) item[k] = String(item[k]).slice(0, 10);
  });
  return item;
}

// Today as YYYY-MM-DD in the user's LOCAL timezone. Using toISOString() returns UTC, so
// late-evening users in negative-UTC timezones (PEI is UTC-3/-4) would see tomorrow.
function todayLocal() {
  const d = new Date();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${d.getFullYear()}-${m}-${day}`;
}

async function apiPost(payload) {
  if (!useSheets) return null;
  try {
    if (payload && payload.item) {
      // Strip runtime-only fields; the sheet only stores the HEADERS columns.
      const it = Object.assign({}, payload.item);
      delete it._id; delete it._row; delete it._deleted;
      scrubItemDates(it);
      payload = Object.assign({}, payload, { item: it });
    }
    // Every write is scoped to a lab. When a modal is open on a foreign item, writes
    // (sharing transactions) must target THAT item's lab, not the lab being browsed.
    const targetLab = (editIdx !== null && editLab) ? editLab : activeLab;
    const body = Object.assign({ lab: targetLab }, payload);
    const r = await fetch(API_URL, { method:'POST', body: JSON.stringify(body) });
    return await r.json().catch(() => null);
  } catch(e) { console.warn('API write failed', e); return null; }
}

// ── Borrowed-copy mirroring ────────────────────────────────────────────
// When an item is shared/requested out, a lightweight COPY is written into the
// BORROWING lab's tab so it shows in that lab's normal list. The host row remains the
// single source of truth; the copy is display-only and read-only. On resolution the
// copy is soft-deleted (Status='Deleted'). All copy writes are best-effort: if one
// fails the host row is still correct and a later cross-lab refresh reconciles.

// Encode "Name (BorrowingLab)" so the host row records which lab borrowed it; the copy
// stores the same so its own resolution path can find the host. Parsed back for display.
function encodeBorrower(name, lab) { return lab ? `${name} (${lab})` : name; }
function parseBorrower(raw) {
  const m = /^(.*?)\s*\(([^()]+)\)\s*$/.exec(raw || '');
  return m ? { name: m[1].trim(), lab: m[2].trim() } : { name: (raw||'').trim(), lab: '' };
}

// A borrowed copy is identifiable by: Vendor holds a known host LAB name (a real item
// never has another lab as its Vendor), plus Name+Catalog+Borrowed all matching. This
// quartet is unambiguous and the Vendor∈LAB_NAMES guard prevents ever touching a real item.
function isBorrowedCopy(row) {
  return LAB_NAMES.includes((row.Vendor || '').trim());
}

// A borrowed copy is a read-only mirror living in the borrowing lab's tab. Its loan
// state lives in the Sharing column (Requested → Borrowed → Bring Back → IOU), driven by
// host actions via syncCopy. Its Status column starts as a normal stock value and is
// flipped to 'Deleted' on resolution (which hides it; the _deleted flag derives from
// Status on read). Copy-detection is by Vendor (= host lab name ∈ LAB_NAMES), never by
// Sharing, so the copy can always be told apart from a real item.

// Write a basic-info-only copy into the borrowing lab's tab. No location/stock/policy.
// The copy's LOAN STATE lives in Sharing (Borrowed/Requested/...); Status stays a normal
// stock value until resolution flips it to Deleted (which hides it). Three columns, each
// a discrete value in the sheet — nothing inferred.
async function writeBorrowedCopy(hostItem, hostLab, borrowingLab, sharingState, borrowerRaw) {
  if (!useSheets || !borrowingLab || borrowingLab === hostLab) return;
  const copy = {
    Name: hostItem.Name, Vendor: hostLab,            // Vendor = originating (host) lab
    Catalog: hostItem.Catalog, Price: hostItem.Price,
    Type: hostItem.Type, Size: hostItem.Size,
    Notes: hostItem.Notes, CAS: hostItem.CAS, SDS: hostItem.SDS, URL: hostItem.URL,
    Container: hostItem.Container, Safety: hostItem.Safety,
    Room:'', Location1:'', Location2:'', Box1:'', Box2:'', GridXY:'',
    Stock:'', Threshold:'',
    Policy:'',                                        // copy has no policy of its own
    Sharing: sharingState,                            // the loan-state channel
    Borrower: borrowerRaw, Borrowed: hostItem.Borrowed,
    Status: 'In Stock',                               // stock channel; → Deleted to hide
  };
  try {
    scrubItemDates(copy);
    await fetch(API_URL, { method:'POST',
      body: JSON.stringify({ lab: borrowingLab, action:'addItem', item: copy }) });
  } catch(e) { console.warn('borrowed-copy write failed (host row authoritative)', e); }
}

// Find the borrowed copy in the borrowing lab and apply the given column changes
// ({Sharing} for a loan-state change, {Status:'Deleted'} to resolve/hide). Identity is
// stable: it IS a borrowed copy (Vendor ∈ lab names) + Vendor = host lab + Name + Catalog,
// preferring an exact Borrower/Borrowed match, else the unique such copy. Best-effort.
async function syncCopy(borrowingLab, hostLab, match, changes) {
  if (!useSheets || !borrowingLab || borrowingLab === hostLab) return;
  try {
    const r = await fetch(API_URL + '?action=read&lab=' + encodeURIComponent(borrowingLab));
    const d = await r.json();
    if (!d || !d.items) return;
    const hl = (hostLab || '').trim();
    const wantBorrower = (match.Borrower || '').trim();
    const wantBorrowed = (match.Borrowed || '').trim();
    const candidates = d.items.filter(it =>
      it && it._row &&
      isBorrowedCopy(it) &&
      (it.Vendor||'').trim() === hl &&
      (it.Name||'').trim() === (match.Name||'').trim() &&
      (it.Catalog||'').trim() === (match.Catalog||'').trim() &&
      (it.Status||'').toLowerCase().trim() !== 'deleted');
    if (candidates.length === 0) return;
    const row =
      candidates.find(it => (it.Borrower||'').trim() === wantBorrower &&
                            (it.Borrowed||'').trim() === wantBorrowed) ||
      candidates.find(it => (it.Borrower||'').trim() === wantBorrower) ||
      (candidates.length === 1 ? candidates[0] : null);
    if (!row) return;
    const clean = Object.assign({}, row);
    delete clean._row; delete clean._deleted; delete clean._id;
    Object.assign(clean, changes);                    // discrete column writes only
    scrubItemDates(clean);
    await fetch(API_URL, { method:'POST',
      body: JSON.stringify({ lab: borrowingLab, action:'updateItem', row: row._row, item: clean }) });
  } catch(e) { console.warn('borrowed-copy sync failed (host row authoritative)', e); }
}

// Symmetric counterpart: drive the HOST row in the host lab when an action is invoked
// from the borrower's copy (Return / IOU clicked on the copy row). The host row is
// the source of truth, so its Sharing / Borrower / Borrowed fields must be updated for
// the host to see the change. Identity is Name + Catalog + Borrower + Borrowed (the
// confirmed unique key), with Borrower as the primary discriminator if Borrowed format
// has drifted via Sheets round-trip.
async function syncHost(borrowingLab, hostLab, match, changes) {
  if (!useSheets || !hostLab || borrowingLab === hostLab) return;
  try {
    const r = await fetch(API_URL + '?action=read&lab=' + encodeURIComponent(hostLab));
    const d = await r.json();
    if (!d || !d.items) return;
    const wantBorrower = (match.Borrower || '').trim();
    const wantBorrowed = (match.Borrowed || '').trim();
    // The host row is NOT a borrowed copy — its Vendor is a real vendor, not a lab. We
    // identify it strictly by Name + Catalog + Borrower (+ Borrowed as tiebreaker) and
    // exclude already-resolved rows.
    const candidates = d.items.filter(it =>
      it && it._row &&
      !isBorrowedCopy(it) &&
      (it.Name||'').trim() === (match.Name||'').trim() &&
      (it.Catalog||'').trim() === (match.Catalog||'').trim() &&
      (it.Status||'').toLowerCase().trim() !== 'deleted' &&
      (it.Borrower||'').trim() === wantBorrower);
    if (candidates.length === 0) return;
    const row =
      candidates.find(it => (it.Borrowed||'').trim() === wantBorrowed) ||
      (candidates.length === 1 ? candidates[0] : null);
    if (!row) return;
    const clean = Object.assign({}, row);
    delete clean._row; delete clean._deleted; delete clean._id;
    Object.assign(clean, changes);
    scrubItemDates(clean);
    await fetch(API_URL, { method:'POST',
      body: JSON.stringify({ lab: hostLab, action:'updateItem', row: row._row, item: clean }) });
  } catch(e) { console.warn('host-row sync failed', e); }
}

// Single point of persistence — used by every mutator
async function persistItem(item) {
  if (!useSheets) return;
  if (item._row) {
    apiPost({ action:'updateItem', row:item._row, item });
  } else {
    // New item — wait for response so subsequent edits can find _row
    const r = await apiPost({ action:'addItem', item });
    if (r && r.row) item._row = r.row;
  }
}

// ── Load ───────────────────────────────────────────────────────────────
async function loadData() {
  items = []; filtered = [];

  // Both URL and active lab are required. Without either, prompt the user toward Setup.
  if (!API_URL || !activeLab) {
    $('inv-body').innerHTML = '<tr><td colspan="5" class="empty">' +
      'Click <strong>Setup</strong> in the top right to enter your data source URL and choose your lab.' +
      '</td></tr>';
    nextId = 0;
    buildFilterOptions();
    applyFilters();
    return;
  }

  // 1. Instant paint from the localStorage cache, if present. The app is usable
  //    immediately while the live fetch runs in the background.
  const cached = readLabCache(activeLab);
  let paintedFromCache = false;
  if (cached) {
    useSheets = true;
    items = cached.map((row, i) => normaliseRow(row, i));
    nextId = items.length;
    buildFilterOptions();
    applyFilters();
    setRefreshingHint(true);
    paintedFromCache = true;
  } else {
    $('inv-body').innerHTML = `<tr><td colspan="5" class="empty">Loading <strong>${esc(activeLab)}</strong>…</td></tr>`;
  }

  // 2. Always revalidate against the server.
  const si = await apiRead();
  if (si === null) {
    setRefreshingHint(false);
    if (!paintedFromCache) {
      $('inv-body').innerHTML = '<tr><td colspan="5" style="padding:20px;color:var(--danger);">Could not load data.</td></tr>';
    }
    // If we painted from cache, keep showing it — the network call failed but stale data
    // is better than an error wipe.
    return;
  }

  useSheets = true;
  writeLabCache(activeLab, si);                 // refresh the cache for next open
  items = si.map((row, i) => normaliseRow(row, i));
  nextId = items.length;
  buildFilterOptions();
  applyFilters();
  setRefreshingHint(false);
}

// Small "refreshing…" hint shown while a background revalidation runs after a cache paint.
function setRefreshingHint(on) {
  const el = $('section-counts');
  if (!el) return;
  if (on) {
    el.dataset.refreshing = '1';
    if (!/refreshing…$/.test(el.textContent)) {
      el.textContent = (el.textContent ? el.textContent + '   ·   ' : '') + 'refreshing…';
    }
  } else {
    delete el.dataset.refreshing;
    // updateSectionCounts (called via applyFilters) will overwrite the text cleanly.
  }
}

function normaliseRow(row, i) {
  const obj = Object.assign({}, row);
  obj._id = i;
  obj._row = row._row;
  obj._deleted = ['archived','deleted'].includes((obj.Status||'').toLowerCase());

  // Strip ISO datetime artifacts from text fields
  ['CAS','SDS','URL','Notes','Catalog','Price','Size',
   'Room','Location1','Location2','Box1','GridXY','Box2'].forEach(k => {
    const v = String(obj[k]||'');
    obj[k] = /T\d{2}:\d{2}:\d{2}/.test(v) ? '' : v;
  });
  // Date fields: keep only YYYY-MM-DD
  ['Received','Borrowed'].forEach(k => { obj[k] = String(obj[k]||'').slice(0,10); });

  // Reconcile Box2 to sheet Stock for boxed items
  if (obj.Box1) {
    const sheetStock = parseInt(obj.Stock, 10);
    if (!isNaN(sheetStock) && sheetStock > 0) {
      const placed = box2Coords(obj.Box2 || '').length;
      if (sheetStock < placed) {
        console.warn(`Stock drift on load: "${obj.Name}" sheet says ${sheetStock} but ${placed} placed coords. Keeping placed coords.`);
      }
      obj.Box2 = reconcileBox2(obj.Box2 || '', sheetStock);
    }
  }
  return obj;
}

// ── Box helpers ────────────────────────────────────────────────────────
function parseGridXY(b2) {
  if (!b2) return null;
  const mx = b2.match(/X(\d+)/i), my = b2.match(/Y(\d+)/i);
  if (!mx || !my) return null;
  const cols = Math.min(parseInt(mx[1],10), 26);
  const rows = Math.min(parseInt(my[1],10), 26);
  return (cols >= 1 && rows >= 1) ? {cols, rows} : null;
}

function parseBox2(b3) {
  if (!b3 || !b3.trim()) return [];
  return b3.trim().split(/\s+/)
    .filter(s => s === '0' || /^[A-Z]\d+$/i.test(s))
    .map(s => s === '0' ? '0' : s.toUpperCase());
}
function box2Coords(b3)    { return parseBox2(b3).filter(s => s !== '0'); }
function box2ListCount(b3) { return parseBox2(b3).filter(s => s === '0').length; }
function encodeBox2(arr)   { return arr.join(' '); }

// Reconcile Box2 to a stock count.
//   - Grow: append '0' (unplaced) tokens to reach the new count.
//   - Shrink: truncate from the END of the token list. The last-added units (whether
//     placed or unplaced) are removed first; earlier placements are preserved.
function reconcileBox2(b3, newStock) {
  const tokens = parseBox2(b3);
  const total  = Math.max(0, newStock|0);
  if (total < tokens.length) return encodeBox2(tokens.slice(0, total));
  return encodeBox2([...tokens, ...Array(total - tokens.length).fill('0')]);
}

// Two items are box-siblings only if they share the FULL location path: Location1, Location2, AND Box1.
// A box named "Drawers" in "04 Prep > Cabinet" is a different physical box from "Drawers" in "05 PCR > Cabinet".
function sameBoxKey(a, b) {
  return (a.Location1||'') === (b.Location1||'')
      && (a.Location2||'') === (b.Location2||'')
      && (a.Box1||'')      === (b.Box1||'');
}

// The array backing the currently-open modal. For a local item that's the active lab's
// `items`. For a foreign (read-only) item it's that lab's cross-lab result set, so box
// contents and item-to-item navigation work identically without copying anything into
// `items`. Outside a foreign view this is just `items`.
function modalItems() {
  return (editReadOnly && editLab && crossLabItems[editLab]) ? crossLabItems[editLab] : items;
}
function modalFind(id) {
  return modalItems().find(i => i._id === id);
}
// Strictly the active-lab item currently open in the modal — used by save/update paths
// that must never operate on a foreign read-only item.
function currentOwnItem() {
  return items.find(i => i._id === editIdx) || null;
}

function boxSiblings(item) {
  if (!item.Box1) return [];
  return modalItems().filter(i => !i._deleted && sameBoxKey(i, item));
}

// Like boxSiblings, but if `preview` is a shallow-cloned item with the SAME _id as something
// in the array, the clone replaces the real one. Used during live form previews so unplaced
// rows update as the Stock field changes, without mutating the canonical state.
function boxSiblingsWithPreview(item, preview) {
  const sibs = boxSiblings(item);
  if (!preview || preview._id == null) return sibs;
  return sibs.map(s => s._id === preview._id ? preview : s);
}

// Apply a stock change correctly for both boxed and unboxed items.
// Returns the effective stock after reconciliation.
function applyStockChange(item, newStock) {
  newStock = Math.max(0, newStock|0);
  if (item.Box1) {
    item.Box2  = reconcileBox2(item.Box2 || '', newStock);
    item.Stock = parseBox2(item.Box2).length;
  } else {
    item.Stock = newStock;
    if (!useSheets) localStorage.setItem(stockKey(item), newStock);
  }
  return item.Stock;
}

// ── Status / Sharing ───────────────────────────────────────────────────
function stockDerivedStatus(item) {
  const s = getStock(item), t = getThreshold(item);
  if (s <= 0) return 'Out of Stock';
  if (s <= t) return 'Low Stock';
  return 'In Stock';
}

// Status holds ONLY stock/order/lifecycle states — never sharing. Discrete value in the
// sheet, no inference.
function getEffectiveStatus(item) {
  const st = (item.Status||'').toLowerCase().trim();
  if (st === 'deleted')  return 'Deleted';
  if (st === 'archived') return 'Archived';
  if (item._deleted)     return 'Archived';   // _deleted derives from Status on read
  if (st === 'on order') return 'On Order';
  if (st === 'arrived')  return 'Arrived';
  return stockDerivedStatus(item);
}

// Sharing holds ONLY the transactional loan state (or empty when idle). No policy values,
// no suffixes — the exact string in the sheet is the state.
function getSharingState(item) {
  const sh = (item.Sharing||'').trim();
  return ['Shared','Borrowed','Requested','IOU','Bring Back','Denied'].includes(sh) ? sh : '';
}

// Policy is its own column: Yes / Ask / No. Read it directly — no parsing, no suffix.
function getSharingPolicy(item) {
  const p = (item.Policy||'').trim();
  return ['Yes','Ask','No'].includes(p) ? p : 'No';
}

const STATUS_CSS = {
  'In Stock':'in-stock','Low Stock':'order-now','On Order':'on-order',
  'Arrived':'arrived','Out of Stock':'out-of-stock',
  'Shared':'shared','Borrowed':'shared','Requested':'requested','IOU':'bring-back','Bring Back':'bring-back','Denied':'bring-back','Archived':'archived',
};
function statusBtnClass(s) { return STATUS_CSS[s] || 'in-stock'; }

// Row button label: an active Sharing (loan) state takes precedence over the stock
// Status, so a borrowed/recalled item reads its loan state rather than "In Stock".
function displayStatus(item) {
  const sh = getSharingState(item);
  if (sh) return sh;                 // any non-empty loan state wins
  return getEffectiveStatus(item);
}

function updateStatus(item, status) {
  item.Status   = status;
  item._deleted = status === 'Archived' || status === 'Deleted';
  persistItem(item);
}
function updateSharing(item, val) {
  item.Sharing = val;
  persistItem(item);
}

// ── Stock ──────────────────────────────────────────────────────────────
function stockKey(item) {
  return ('s_'+item.Vendor+'_'+item.Catalog+'_'+item.Name).replace(/\s+/g,'_').slice(0,100);
}
function getStock(item) {
  if (item.Box1) {
    const tokens = parseBox2(item.Box2).length;
    if (tokens > 0) return tokens;
    const sheetStock = parseInt(item.Stock, 10);
    return isNaN(sheetStock) ? 0 : sheetStock;
  }
  if (useSheets) { const v = parseInt(item.Stock,10); return isNaN(v)?0:v; }
  const s = localStorage.getItem(stockKey(item));
  return s !== null ? parseInt(s,10) : (parseInt(item.Stock,10) || 0);
}
function getThreshold(item) {
  const v = parseInt(item.Threshold,10);
  return isNaN(v) ? 1 : v;
}

// ── Combo fields ───────────────────────────────────────────────────────
function comboSelChange(baseId) {
  const sel = $(baseId + '-sel');
  const inp = $(baseId);
  if (!sel || !inp) return;
  if (sel.value === COMBO_NEW) {
    sel.style.display = 'none';
    inp.style.display = '';
    inp.value = '';
    const back = sel.parentElement.querySelector('.combo-back');
    if (back) back.style.display = '';
    inp.focus();
  } else {
    inp.value = sel.value;
  }
  if (baseId === 'f-box1') onBoxFieldChange();
  if (baseId === 'f-location') updateSublocOptions();
}

function comboBack(baseId) {
  const sel = $(baseId + '-sel');
  const inp = $(baseId);
  if (!sel || !inp) return;
  inp.style.display = 'none';
  inp.value = sel.value === COMBO_NEW ? '' : sel.value;
  sel.value = inp.value || '';
  sel.style.display = '';
  const back = sel.parentElement.querySelector('.combo-back');
  if (back) back.style.display = 'none';
}

function comboSet(baseId, value) {
  const sel = $(baseId + '-sel');
  const inp = $(baseId);
  if (!sel || !inp) return;
  // Reset to select mode
  inp.style.display = 'none';
  sel.style.display = '';
  const back = sel.parentElement ? sel.parentElement.querySelector('.combo-back') : null;
  if (back) back.style.display = 'none';

  const exists = [...sel.options].some(o => o.value === value);
  if (exists || !value) {
    sel.value = value || '';
    inp.value = value || '';
  } else if (editReadOnly) {
    // Foreign/read-only item: its value won't be in the active lab's option list.
    // Inject it as a one-off option and stay in (disabled) select mode — never show
    // the "pick existing" back-link or the free-text input for a read-only item.
    const opt = document.createElement('option');
    opt.value = value; opt.textContent = value;
    sel.appendChild(opt);
    sel.value = value;
    inp.value = value;
  } else {
    sel.style.display = 'none';
    inp.style.display = '';
    inp.value = value;
    if (back) back.style.display = '';
  }
  if (baseId === 'f-location') updateSublocOptions();
}

function updateSublocOptions() {
  const loc1 = fv('f-location');
  const sel = $('f-subloc-sel');
  if (!sel) return;
  const cur = fv('f-subloc');
  const vals = [...new Set(
    items.filter(i => !i._deleted && (!loc1 || i.Location1 === loc1) && i.Location2)
         .map(i => i.Location2)
  )].sort();
  fillSelect(sel, vals, cur, true);
  const inp = $('f-subloc');
  if (inp && inp.style.display === 'none') inp.value = sel.value;
}

// Populate a <select> with values; preserve current selection if possible.
// `withNew` adds the "— New —" sentinel for combo fields.
// If `current` is set but not in `vals` and not `withNew`, it's preserved as a sticky option
// so the user's filter choice doesn't silently vanish when other filters narrow the data.
function fillSelect(sel, vals, current, withNew) {
  sel.innerHTML = '<option value="">—</option>';
  vals.forEach(v => {
    const o = document.createElement('option');
    o.value = o.textContent = v;
    sel.appendChild(o);
  });
  if (withNew) {
    const o = document.createElement('option');
    o.value = o.textContent = COMBO_NEW;
    sel.appendChild(o);
  } else if (current && !vals.includes(current)) {
    // Sticky filter selection — kept even when no items currently match
    const o = document.createElement('option');
    o.value = current;
    o.textContent = current + ' (no matches)';
    sel.appendChild(o);
  }
  if (current && [...sel.options].some(o => o.value === current)) sel.value = current;
}

// ── Filters ────────────────────────────────────────────────────────────
// Active filter values from the subnav.
function getActiveFilters() {
  return {
    vendor: $('filter-vendor').value,
    type:   $('filter-type').value,
    loc:    $('filter-loc').value,
    box:    $('filter-box').value,
  };
}

// Apply selected filters, optionally excluding one — used by buildFilterOptions
// to compute each dropdown's choices from items matching the OTHER active filters.
function itemsMatchingFilters(active, except) {
  return items.filter(item => {
    if (except !== 'vendor' && active.vendor &&
        (item.Vendor||'').split('(')[0].trim() !== active.vendor) return false;
    if (except !== 'type' && active.type && item.Type !== active.type) return false;
    if (except !== 'loc'  && active.loc  && item.Location1 !== active.loc) return false;
    if (except !== 'box'  && active.box  && item.Box1 !== active.box) return false;
    return true;
  });
}

// Rebuild the four cascading subnav filter dropdowns. Each dropdown's options come from
// items matching the OTHER active filters — so picking a Location restricts the Box list, etc.
// Selections that no longer match any data are kept as sticky "(no matches)" options.
function buildSubnavFilters() {
  const active = getActiveFilters();
  const specs = [
    { id:'filter-vendor', key:'vendor', extract: i => (i.Vendor||'').split('(')[0].trim() },
    { id:'filter-type',   key:'type',   extract: i => i.Type },
    { id:'filter-loc',    key:'loc',    extract: i => i.Location1 },
    { id:'filter-box',    key:'box',    extract: i => i.Box1 },
  ];
  specs.forEach(({id, key, extract}) => {
    const sel = $(id);
    const pool = itemsMatchingFilters(active, key);
    const vals = [...new Set(pool.map(extract).filter(Boolean))].sort();
    fillSelect(sel, vals, sel.value, false);
  });
}

// Rebuild the form's combo selects. These show ALL existing values regardless of any
// active subnav filter — typing in the form is "what this item is", not "narrow my view".
function buildFormCombos() {
  const uniq = getter => [...new Set(items.map(getter).filter(Boolean))].sort();
  const specs = [
    ['f-vendor-sel',   uniq(i => (i.Vendor||'').trim())],
    ['f-container-sel',uniq(i => i.Container)],
    ['f-type-sel',     uniq(i => i.Type)],
    ['f-location-sel', uniq(i => i.Location1)],
    ['f-subloc-sel',   uniq(i => i.Location2)],
    ['f-box1-sel',     uniq(i => i.Box1)],
    ['f-room-sel',     uniq(i => i.Room)],
  ];
  specs.forEach(([id, vals]) => {
    const sel = $(id);
    if (sel) fillSelect(sel, vals, sel.value, true);
  });
}

// Backwards-compat name used by mutators that need both rebuilt.
function buildFilterOptions() {
  buildSubnavFilters();
  buildFormCombos();
}

function clearFilters() {
  $('search-box').value = '';
  ['filter-vendor','filter-type','filter-loc','filter-box'].forEach(id => $(id).value = '');
  buildSubnavFilters();
  applyFilters();
}

function applyFilters() {
  if (searchScope === 'everywhere') { applyEverywhere(); return; }

  // Rebuild dropdown choices first — each dropdown's options narrow based on the OTHER active filters.
  // Selections that no longer match any data are kept as sticky "(no matches)" options.
  buildSubnavFilters();

  const q      = $('search-box').value.toLowerCase();
  const active = getActiveFilters();

  filtered = itemsMatchingFilters(active, null).filter(item => {
    // Status='Deleted' hides the row from every view (soft delete). Archived items still
    // appear in the Archived section — only true deletions are removed from rendering.
    if ((item.Status||'').toLowerCase().trim() === 'deleted') return false;
    if (!q) return true;
    const hay = [item.Name,item.Vendor,item.Notes,item.Location1,item.Location2,
                 item.Box1,item.Room,item.GridXY,item.Catalog,item.CAS,item.Container,item.Safety,item.Borrower].join(' ').toLowerCase();
    return hay.includes(q);
  }).sort((a,b) => {
    // Primary: status bucket order (grouping persists even though headers are gone).
    const ra = statusRank(a), rb = statusRank(b);
    if (ra !== rb) return ra - rb;
    // Secondary: the active column sort, applied within each bucket.
    const av = sortCol === 'Stock' ? getStock(a) : (a[sortCol]||'');
    const bv = sortCol === 'Stock' ? getStock(b) : (b[sortCol]||'');
    return av.toString().localeCompare(bv.toString(), undefined, {numeric:true}) * sortDir;
  });

  updateSectionCounts();
  renderInventory();
}

// Status bucket ordering for the flat list. Lower rank sorts first.
//   0 Ordering: Arrived, then On Order
//   1 Sharing:  Requested, then Shared
//   2 Low Stock
//   3 In Stock
//   4 Out of Stock
//   5 Archived (and Deleted, though Deleted is filtered out upstream)
function statusRank(item) {
  const sh = getSharingState(item);
  if (sh === 'Denied')     return 0.8;   // borrower must acknowledge — very top
  if (sh === 'Bring Back') return 0.9;   // top of the Sharing cluster — needs attention
  if (sh === 'Requested')  return 1.0;
  if (sh === 'Shared')     return 1.1;
  if (sh === 'IOU')        return 1.2;
  const st = getEffectiveStatus(item);
  switch (st) {
    case 'Denied':       return 0.8;   // borrowed copy: must acknowledge — very top
    case 'Bring Back':   return 0.9;   // borrowed copy: recall — needs attention
    case 'Requested':    return 1.0;   // borrowed copy: pending request
    case 'Borrowed':     return 1.1;   // borrowed copy: active loan
    case 'IOU':          return 1.2;   // borrowed copy: owed back
    case 'Arrived':      return 0.0;
    case 'On Order':     return 0.1;
    case 'Low Stock':    return 2;
    case 'In Stock':     return 3;
    case 'Out of Stock': return 4;
    case 'Archived':     return 5;
    case 'Deleted':      return 6;
    default:             return 3;   // unknown → treat as In Stock
  }
}

// Toggle between searching the active lab only and searching every lab.
function toggleSearchScope() {
  searchScope = (searchScope === 'local') ? 'everywhere' : 'local';
  const btn = $('scope-toggle');
  const box = $('search-box');
  if (searchScope === 'everywhere') {
    btn.textContent = 'Search All';
    btn.className = 'btn scope-everywhere';
    btn.style.cssText = 'font-size:14px;padding:3px 10px;white-space:nowrap;';
    box.placeholder = 'Search all labs…';
    // Begin fetching the other labs NOW (the home-lab load already warmed Apps Script,
    // so these don't each pay the cold-start). Reuse the session cache if already
    // populated — the user only just looked.
    prefetchOtherLabs();
  } else {
    btn.textContent = 'Search Lab';
    btn.className = 'btn scope-local';
    btn.style.cssText = 'font-size:14px;padding:3px 10px;white-space:nowrap;';
    box.placeholder = defaultLab ? `Search ${defaultLab} Lab` : 'Search…';
  }
  applyFilters();
}

// Kick off the cross-lab fetches. Home lab is seeded from the in-memory items.
// Each other lab is fetched once per session; results merge into crossLabItems and
// trigger a re-render if an everywhere search is active.
function prefetchOtherLabs() {
  // Seed/refresh the home lab from current memory.
  crossLabItems[activeLab] = items.slice();

  const seq = ++crossLabSeq;
  const others = LAB_NAMES.filter(l => l !== activeLab);
  others.forEach(lab => {
    // Reuse within the session: skip refetch if we already have this lab's data.
    if (Array.isArray(crossLabItems[lab])) return;
    fetchLabItems(lab).then(rows => {
      if (seq !== crossLabSeq && searchScope !== 'everywhere') return;
      crossLabItems[lab] = rows || [];
      if (searchScope === 'everywhere') {
        const q = $('search-box').value.toLowerCase().trim();
        if (q) renderEverywhere(q);
      }
    });
  });
}

// Everywhere search: filters whatever is currently in crossLabItems. Fetching is
// handled by prefetchOtherLabs (triggered on toggle), not here.
function applyEverywhere() {
  const q = $('search-box').value.toLowerCase().trim();
  const tbody = $('inv-body');

  // Keep the home lab slice fresh (it may have changed since toggle).
  crossLabItems[activeLab] = items.slice();

  if (!q) {
    const pending = LAB_NAMES.filter(l => !Array.isArray(crossLabItems[l])).length;
    tbody.innerHTML = '<tr><td colspan="5" class="empty">Enter a search term to look across all labs.'
      + (pending ? ` <span style="color:var(--mut);">(${pending} lab${pending===1?'':'s'} still loading)</span>` : '')
      + '</td></tr>';
    $('section-counts').textContent = '';
    return;
  }
  renderEverywhere(q);
}

// Fetch one lab's rows without disturbing the active in-memory `items`.
async function fetchLabItems(lab) {
  if (!API_URL) return [];
  try {
    const r = await fetch(API_URL + '?action=read&lab=' + encodeURIComponent(lab));
    const d = await r.json();
    if (d.error || !d.items) return [];
    return d.items.map((row, i) => normaliseRow(row, i));
  } catch(e) { console.warn('cross-lab fetch failed for', lab, e); return []; }
}

// Render cross-lab results grouped by lab. Flat within each lab (no status sub-sections).
function renderEverywhere(q) {
  const tbody = $('inv-body');
  tbody.innerHTML = '';
  let total = 0;

  // Stable lab order: active lab first, then the rest alphabetically.
  const labs = Object.keys(crossLabItems).sort((a,b) => {
    if (a === activeLab) return -1;
    if (b === activeLab) return 1;
    return a.localeCompare(b);
  });

  labs.forEach(lab => {
    const matches = (crossLabItems[lab] || []).filter(item => {
      if (item._deleted) return false;
      const hay = [item.Name,item.Vendor,item.Notes,item.Location1,item.Location2,
                   item.Box1,item.Room,item.GridXY,item.Catalog,item.CAS,item.Container,item.Safety,item.Borrower]
                   .join(' ').toLowerCase();
      return hay.includes(q);
    }).sort((a,b) => (a.Name||'').localeCompare(b.Name||''));
    if (!matches.length) return;

    const isForeign = lab !== activeLab;
    const hdr = document.createElement('tr');
    hdr.className = 'lab-group-row' + (isForeign ? ' foreign' : '');
    hdr.innerHTML = `<td colspan="5">${esc(lab)}${isForeign ? ' — read-only' : ''} · ${matches.length}</td>`;
    tbody.appendChild(hdr);
    matches.forEach(item => { tbody.appendChild(makeCrossLabRow(item, lab)); total++; });
  });

  if (!total) {
    tbody.innerHTML = `<tr><td colspan="5" class="empty">No items match “${esc(q)}” in any loaded lab.</td></tr>`;
  }
  $('section-counts').textContent = `${total} match${total===1?'':'es'} across ${labs.length} lab${labs.length===1?'':'s'} searched`;
}

// A row in everywhere mode. Active-lab rows are editable (open modal); foreign rows are
// read-only — clicking does nothing destructive, the status button is non-interactive.
function makeCrossLabRow(item, lab) {
  const isForeign = lab !== activeLab;
  const stock    = getStock(item);
  const thresh   = getThreshold(item);
  const stockCls = stock<=0 ? 'stock-danger' : stock<=thresh ? 'stock-warn' : 'stock-ok';
  const btnSt    = displayStatus(item);
  const nameHtml = item.URL && item.URL!=='N/A'
    ? `<a href="${esc(item.URL)}" target="_blank">${esc(item.Name)}</a>` : esc(item.Name);
  const nameSub  = [(item.Vendor||'').split('(')[0].trim(), item.Catalog, item.Size, item.Price].filter(Boolean).join(' · ');
  const locSub   = [item.Location2, item.Box1].filter(Boolean).join(', ');
  const sdsLink  = item.SDS && item.SDS!=='N/A'
    ? `<a href="sds/${esc(item.SDS)}" target="_blank" style="color:var(--warn);text-decoration:none;border-bottom:1px dotted var(--warn);">SDS</a>` : '';
  const casStr   = item.CAS && item.CAS!=='N/A' ? `CAS ${esc(item.CAS)}` : '';
  const typeSub  = [sdsLink, casStr].filter(Boolean).join(' · ');

  const statusBtn = isForeign
    ? `<button class="status-btn ${statusBtnClass(btnSt)}" onclick="editForeignItem(${item._id},${LAB_NAMES.indexOf(lab)})">${btnSt}</button>`
    : `<button class="status-btn ${statusBtnClass(btnSt)}" onclick="editItem(${item._id},false)">${btnSt}</button>`;

  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td style="white-space:nowrap;">${statusBtn}</td>
    <td><div class="stock-cell"><span class="stock-num ${stockCls} readonly">${stock}</span></div></td>
    <td>
      <div class="item-name">${nameHtml}</div>
      ${nameSub ? `<div class="item-sub">${esc(nameSub)}</div>` : ''}
    </td>
    <td>
      <div>${esc(item.Type||'—')}</div>
      ${typeSub ? `<div class="item-sub">${typeSub}</div>` : ''}
    </td>
    <td>
      <div>${loc1WithRoom(item)}</div>
      ${locSub ? `<div class="loc-sub">${esc(locSub)}</div>` : ''}
    </td>`;
  return tr;
}

// Section ordering and predicates — single source of truth. The "Shared" section also
// holds borrowed copies, whose state lives entirely in Status (surfaced via displayStatus):
// Borrowed / Requested / Bring Back / IOU / Denied.
const SHARED_DISPLAY = new Set(['Shared','Requested','Bring Back','IOU','Denied','Borrowed']);
const SECTIONS = [
  ['Shared',       i => SHARED_DISPLAY.has(displayStatus(i))],
  ['Arrived',      i => getEffectiveStatus(i) === 'Arrived'],
  ['Ordered',      i => getEffectiveStatus(i) === 'On Order'],
  ['Out of Stock', i => getEffectiveStatus(i) === 'Out of Stock'],
  ['Low Stock',    i => getEffectiveStatus(i) === 'Low Stock'],
  ['In Stock',     i => getEffectiveStatus(i) === 'In Stock'],
  ['Archived',     i => getEffectiveStatus(i) === 'Archived'],
];

function updateSectionCounts() {
  const active = items.filter(i => !i._deleted);
  const parts = SECTIONS
    .map(([label, pred]) => { const n = active.filter(pred).length; return n ? `${n} ${label}` : null; })
    .filter(Boolean);
  parts.push(`${active.length} Total`);
  $('section-counts').textContent = parts.join('  ·  ');
}

function sortBy(col) {
  if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = 1; }
  document.querySelectorAll('.inv-table th[data-col]').forEach(th => {
    th.classList.remove('sort-asc','sort-desc');
    if (th.dataset.col === col) th.classList.add(sortDir === 1 ? 'sort-asc' : 'sort-desc');
  });
  applyFilters();
}

// ── Render table ───────────────────────────────────────────────────────
// Flat list — the status button on each row conveys status; no section header rows.
function renderInventory() {
  const tbody = $('inv-body');
  tbody.innerHTML = '';
  if (!filtered.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty">No items match your filters.</td></tr>';
    return;
  }
  filtered.forEach(item => tbody.appendChild(makeItemRow(item)));
}

function makeItemRow(item) {
  const stock    = getStock(item);
  const thresh   = getThreshold(item);
  const stockCls = stock<=0 ? 'stock-danger' : stock<=thresh ? 'stock-warn' : 'stock-ok';
  const sharing  = getSharingState(item);
  // Transactional sharing state takes precedence over stock status on the row button.
  const isShared = (sharing==='Shared'||sharing==='Requested'||sharing==='Bring Back'||sharing==='IOU'||sharing==='Denied');
  const btnSt    = displayStatus(item);
  // Host rows show borrower when in a transactional state; a borrowed COPY is itself a
  // loan record (state in Status, no Sharing), so it always shows its borrower line.
  const showBorr = (isShared || isBorrowedCopy(item)) && item.Borrower;
  const sdsLink  = item.SDS && item.SDS!=='N/A'
    ? `<a href="sds/${esc(item.SDS)}" target="_blank" style="color:var(--warn);text-decoration:none;border-bottom:1px dotted var(--warn);">SDS</a>` : '';
  const casStr   = item.CAS && item.CAS!=='N/A' ? `CAS ${esc(item.CAS)}` : '';
  const typeSub  = [sdsLink, casStr].filter(Boolean).join(' · ');
  const nameHtml = item.URL && item.URL!=='N/A'
    ? `<a href="${esc(item.URL)}" target="_blank">${esc(item.Name)}</a>` : esc(item.Name);
  const nameSub  = [(item.Vendor||'').split('(')[0].trim(), item.Catalog, item.Size, item.Price].filter(Boolean).join(' · ');
  const locSub   = [item.Location2, item.Box1].filter(Boolean).join(', ');

  const stockEditable = !item.Box1;
  const stockCell = stockEditable
    ? `<span class="stock-num ${stockCls}" contenteditable="true"
         onblur="setStockDirect(${item._id},this.textContent)"
         onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}">${stock}</span>`
    : `<span class="stock-num ${stockCls} readonly" title="Boxed item — edit via grid">${stock}</span>`;

  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td style="white-space:nowrap;">
      <button class="status-btn ${statusBtnClass(btnSt)}" onclick="editItem(${item._id},${isShared})">${btnSt}</button>
      ${showBorr ? `<div class="borrower-sub">${esc(item.Borrower)}${item.Borrowed?' · '+esc(item.Borrowed.slice(0,10)):''}</div>` : ''}
    </td>
    <td><div class="stock-cell">${stockCell}</div></td>
    <td>
      <div class="item-name">${nameHtml}</div>
      ${nameSub ? `<div class="item-sub">${esc(nameSub)}</div>` : ''}
    </td>
    <td>
      <div>${esc(item.Type||'—')}</div>
      ${typeSub ? `<div class="item-sub">${typeSub}</div>` : ''}
    </td>
    <td>
      <div>${loc1WithRoom(item)}</div>
      ${locSub ? `<div class="loc-sub">${esc(locSub)}</div>` : ''}
    </td>`;
  return tr;
}

function setStockDirect(id, val) {
  const item = items.find(i => i._id === id);
  if (!item || item.Box1) { applyFilters(); return; }
  const n = parseInt(String(val).replace(/\D/g,''), 10);
  if (isNaN(n)) { applyFilters(); return; }
  applyStockChange(item, n);
  if (!LOCKED_ST.has((item.Status||'').toLowerCase())) {
    updateStatus(item, stockDerivedStatus(item));
  } else {
    persistItem(item);
  }
  applyFilters();
}

// ── Modal: open Add ────────────────────────────────────────────────────
// Toolbar "+ New" entry: opens the modal with a blank form in new-from-toolbar mode.
function openAddModal() {
  editIdx = null; resetLocState(); locView = null;
  editReadOnly = false;
  editLab = activeLab;             // new items belong to the lab currently being viewed
  modalMode = 'new-from-toolbar';
  _hostBeforeNew = null;
  _moveSnapshot = null;
  $('loc-panel-wrap').innerHTML = '';
  resetFormBlank();
  // Sharing card stays visible — its policy can be set up front. Synthetic blank item.
  renderSharingPanel({ Policy:'No', Sharing:'', Borrower:'', Borrowed:'' });
  applyReadOnlyState();
  setLocFieldsDisabled(false);     // new-mode allows location entry
  renderBottomBar();               // shows [Create] ... [Cancel]
  $('edit-modal-overlay').classList.add('open');
  setTimeout(() => $('f-name').focus(), 0);
}

// Reset every form field to its empty default. No item context required.
function resetFormBlank() {
  TEXT_FIELDS.forEach(k => { const id = 'f-' + k.toLowerCase(); if ($(id)) $(id).value = ''; });
  COMBO_FIELDS.forEach(id => comboSet(id, ''));
  $('f-gridxy').value = '';
  $('dim-x').value = '';
  $('dim-y').value = '';
  $('f-notes-text').value = '';
  $('f-stock').value     = 1;
  $('f-threshold').value = 1;
  $('f-date').value      = '';
}

// ── Modal: open Edit ───────────────────────────────────────────────────
function editItem(id, fromShared) {
  const item = items.find(i => i._id === id);
  if (!item) return;
  editIdx = id;
  editLab = activeLab;
  // A borrowed copy lives in your tab but isn't yours to edit — lock its details. The
  // Sharing panel stays live so Return / IOU / Acknowledge still work.
  editReadOnly = isBorrowedCopy(item);
  resetLocState(); locView = null;
  modalMode = 'default';
  _moveSnapshot = null;
  _hostBeforeNew = null;

  populateForm(item);
  configureActionForStatus(item, fromShared);
  renderLocPanel(item);
  applyReadOnlyState();
  setLocFieldsDisabled(true);
  renderBottomBar();
  $('edit-modal-overlay').classList.add('open');
}

// Open a foreign-lab item (from an everywhere search). Identical to editItem except the
// detail sections are read-only and the modal is backed by crossLabItems[lab] (via
// modalItems()) instead of the active lab's `items`. No copying into `items` needed.
function editForeignItem(id, labIdx) {
  const lab = LAB_NAMES[labIdx];
  if (!lab) return;
  const item = (crossLabItems[lab] || []).find(i => i._id === id);
  if (!item) return;
  editIdx = item._id;
  editLab = lab;
  editReadOnly = (lab !== defaultLab);
  resetLocState(); locView = null;
  modalMode = 'default';
  _moveSnapshot = null;
  _hostBeforeNew = null;

  populateForm(item);
  configureActionForStatus(item, false);
  renderLocPanel(item);
  applyReadOnlyState();
  setLocFieldsDisabled(true);
  renderBottomBar();
  $('edit-modal-overlay').classList.add('open');
}

// Enable/disable the Information, Status, and Location sections based on editReadOnly.
// The Sharing section is never disabled — cross-lab borrowing happens there.
// View/Return location-drill buttons stay active (navigation only, no mutation).
function applyReadOnlyState() {
  const ro = editReadOnly;
  const lockIds = [
    // Information fields
    'f-name','f-vendor-sel','f-vendor','f-catalog','f-size','f-type-sel','f-type',
    'f-cas','f-container-sel','f-container','f-safety','f-sds','f-url','f-notes-text',
    'f-price','f-date','f-stock','f-threshold',
    // Location fields
    'f-location-sel','f-location','f-subloc-sel','f-subloc','f-box1-sel','f-box1',
    'f-room-sel','f-room','dim-x','dim-y',
    // Bottom-bar action buttons
    'new-btn','archive-btn','order-btn','move-btn','use-btn',
  ];
  if (ro) {
    lockIds.forEach(id => { const el = $(id); if (el) el.disabled = true; });
  } else {
    // Re-enable Information inputs (a prior read-only open may have disabled them).
    const inputIds = [
      'f-name','f-vendor-sel','f-vendor','f-catalog','f-size','f-type-sel','f-type',
      'f-cas','f-container-sel','f-container','f-safety','f-sds','f-url','f-notes-text',
      'f-price','f-date','f-stock','f-threshold',
    ];
    inputIds.forEach(id => { const el = $(id); if (el) el.disabled = false; });
    // Action buttons always enabled when not read-only.
    ['new-btn','archive-btn','order-btn','move-btn','use-btn'].forEach(id => {
      const el = $(id); if (el) el.disabled = false;
    });
    // Location fields: stay disabled outside move-mode. setLocFieldsDisabled is called
    // by the caller (editItem/openAddModal) after applyReadOnlyState.
  }
  const box = document.querySelector('.modal-box');
  if (box) box.classList.toggle('read-only', ro);
}

// Drive the Status section's left-side action button and the Sharing transactions panel.
// The Status section title mirrors the main-list status button label.
// `fromShared` is accepted for call-site compatibility but no longer affects behavior:
// the Sharing panel now always renders and carries its own state in its title.
function configureActionForStatus(item, fromShared) {
  const status  = getEffectiveStatus(item);
  setStatusTitle(status);

  // The order-btn slot holds the contextual workflow action. Status determines label.
  // (In new-mode the slot is repurposed as [Create] — renderBottomBar handles that.)
  switch (status) {
    case 'On Order':
      if (!$('f-date').value) $('f-date').value = todayLocal();
      configureOrderButton({ label:'Stock',   cls:'btn-order', handler:confirmArrived });
      break;
    case 'Arrived':
      configureOrderButton({ label:'Receive', cls:'btn-order', handler:receiveItem });
      break;
    case 'Archived':
      configureOrderButton({ label:'Restore', cls:'btn-ok',    handler:restoreItem });
      break;
    default: // In Stock, Low Stock, Out of Stock
      configureOrderButton({ label:'Order',   cls:'btn-order', handler:orderItem });
  }

  // Sharing panel — policy can be set even for archived/on-order items.
  // Safety bump: a Low-Stock item with a permissive 'Yes' policy is shown as 'Ask' to
  // FOREIGN-lab viewers, so another lab doesn't grab the last unit by reflex. Within the
  // home lab the true 'Yes' is always shown and editable — the bump is purely a cross-lab
  // display courtesy, never a change to the stored policy.
  const realPolicy = getSharingPolicy(item);
  const bump       = (!isOwnLab() && status === 'Low Stock' && realPolicy === 'Yes');
  renderSharingPanel(item, bump ? 'Ask' : realPolicy);

  // Re-render the bottom bar so visibility/labels match the new status (e.g. archived
  // transitions hide the action buttons and show [Delete] [Restore]).
  renderBottomBar();
}

// True when the active lab matches the user's default lab (their home view).
// True when the item currently in the modal belongs to the user's own (default) lab.
// While a modal is open, the relevant lab is the item's owning lab (editLab), which
// differs from the browsed lab when the item was opened from a cross-lab search.
// Falls back to the browsed lab when no modal is open.
function isOwnLab() {
  const lab = (editIdx !== null && editLab) ? editLab : activeLab;
  return !!(lab && defaultLab && lab === defaultLab);
}

// Configure the bottom-bar contextual workflow button. Pass null to hide it.
function configureOrderButton(spec) {
  const btn = $('order-btn');
  if (!btn) return;
  if (!spec) { btn.style.display = 'none'; return; }
  btn.style.display = '';
  btn.textContent   = spec.label;
  btn.onclick       = spec.handler;
  btn.className     = 'btn btn-sm ' + (spec.cls || 'btn-order');
}

function populateForm(item) {
  $('f-name').value     = item.Name     || '';
  $('f-catalog').value  = item.Catalog  || '';
  $('f-price').value    = item.Price    || '';
  $('f-size').value     = item.Size     || '';
  $('f-cas').value      = item.CAS      || '';
  $('f-safety').value   = item.Safety   || '';
  $('f-sds').value      = item.SDS      || '';
  $('f-url').value      = item.URL      || '';
  $('f-date').value     = item.Received || '';
  $('f-stock').value    = getStock(item);
  $('f-threshold').value = getThreshold(item);
  $('f-notes-text').value = item.Notes  || '';
  $('f-gridxy').value   = item.GridXY   || '';

  comboSet('f-container',item.Container || '');
  comboSet('f-vendor',   item.Vendor    || '');
  comboSet('f-type',     item.Type      || '');
  comboSet('f-location', item.Location1 || '');
  comboSet('f-subloc',   item.Location2 || '');
  comboSet('f-box1',     item.Box1      || '');
  comboSet('f-room',     item.Room      || '');

  const dims = parseGridXY(item.GridXY || '');
  $('dim-x').value = dims ? dims.cols : '';
  $('dim-y').value = dims ? dims.rows : '';

  refreshLinkBtns();
}

// Treat a field value as an openable link only when it parses as an http(s) URL.
function fieldLinkUrl(id) {
  const v = (fv(id) || '').trim();
  if (!v) return null;
  // Accept full http(s) URLs only — bare filenames / Drive paths aren't directly openable.
  if (/^https?:\/\/\S+$/i.test(v)) return v;
  return null;
}

// Render the link icon into the SDS / URL square buttons and enable/disable them based
// on whether the current value is an openable URL.
function refreshLinkBtns() {
  const LINK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1.5-1.5"/></svg>';
  [['open-url','f-url'],['open-sds','f-sds']].forEach(([btnId, fieldId]) => {
    const btn = $(btnId);
    if (!btn) return;
    btn.innerHTML = LINK_SVG;
    btn.disabled  = !fieldLinkUrl(fieldId);
  });
}

// Open a field's URL value in a new tab (guarded — does nothing for non-URL values).
function openFieldLink(id) {
  const url = fieldLinkUrl(id);
  if (!url) return;
  window.open(url, '_blank', 'noopener');
}

// ── Modal commit model: on-blur auto-save + Move/Set for location ─────
// There is no Save button. Information fields (Name, Vendor, Catalog, Size, Type,
// CAS, SDS, URL, Notes, Price, Date, Stock, Threshold) auto-save on blur — each blurred
// field triggers a single updateItem write for the whole item. Stock changes reconcile
// Box2 tokens (preserving placement when shrinking, adding unplaced when growing).
//
// Location fields are DISABLED by default. Clicking [Move] enables them and morphs the
// button to [Set]. Clicking [Set] persists the location change (with all the propagation
// side-effects that commitLocation had). Clicking [Cancel] (which the Use button morphs
// into during move-mode) reverts the location fields and exits move-mode.

// ── Modal mode state ──────────────────────────────────────────────────
// One state machine for the whole modal. Values:
//   'default'         – viewing existing item (most common)
//   'new-from-toolbar'– create-mode opened via toolbar + New (blank form)
//   'new-from-host'   – create-mode opened from inside an existing-item's modal via
//                       the modal's + New button; Location inherited from host, Info blank
//   'move'            – Move clicked; Location fields editable until Set or Cancel
// The archived view ([Delete] [Restore] only) is just the default mode rendered for an
// item whose Status==='Archived' — no separate mode.

let modalMode = 'default';
let _moveSnapshot = null;   // pre-edit snapshot of location field values (for Cancel in move)
let _hostBeforeNew = null;  // host item id we'll return to when Cancel in new-from-host

// Read all form fields into a partial item object — used by createItem and action handlers.
function readForm() {
  return {
    Name:      fv('f-name'),
    Vendor:    fv('f-vendor'),
    Catalog:   fv('f-catalog'),
    Price:     fv('f-price'),
    Type:      fv('f-type'),
    Size:      fv('f-size'),
    Received:  fv('f-date'),
    Threshold: isNaN(fn('f-threshold')) ? 1 : fn('f-threshold'),
    Location1: fv('f-location'),
    Location2: fv('f-subloc'),
    Box1:      fv('f-box1'),
    Room:      fv('f-room'),
    GridXY:    fv('f-gridxy'),
    CAS:       fv('f-cas'),
    Container: fv('f-container'),
    Safety:    fv('f-safety'),
    SDS:       fv('f-sds'),
    URL:       fv('f-url'),
    Notes:     fv('f-notes-text'),
    _stock:    isNaN(fn('f-stock')) ? 0 : fn('f-stock'),
  };
}

// Generic on-blur auto-save for Info fields (everything except Name and Stock, which
// have their own variants). Read all Info fields back to the item, then persist.
function autoSaveField() {
  if (editReadOnly) return;
  if (editIdx === null) return;       // create-mode: no item yet, wait for [Create]
  const item = currentOwnItem(); if (!item) return;
  item.Vendor    = fv('f-vendor');
  item.Catalog   = fv('f-catalog');
  item.Size      = fv('f-size');
  item.Type      = fv('f-type');
  item.CAS       = fv('f-cas');
  item.Container = fv('f-container');
  item.Safety    = fv('f-safety');
  item.SDS       = fv('f-sds');
  item.URL       = fv('f-url');
  item.Notes     = fv('f-notes-text');
  item.Price     = fv('f-price');
